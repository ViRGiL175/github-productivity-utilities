apiVersion: 1

datasources:
  - name: Project analytics
    uid: project-analytics
    type: grafana-postgresql-datasource
    access: proxy
    url: postgres:5432
    user: grafana_reader
    isDefault: true
    editable: false
    jsonData:
      database: project_analytics
      sslmode: disable
      postgresVersion: 1700
      timescaledb: false
    secureJsonData:
      password: $GRAFANA_POSTGRES_PASSWORD
