name: Test field updates

on:
  workflow_dispatch:
    inputs:
      auth_mode:
        description: Token source for org sandbox (pat or app)
        required: false
        default: pat
        type: choice
        options: [pat, app]
  push:
    branches: [gff-pr-field-updates]
    paths: ['src/**', 'itest/field-updates.ts', 'itest/runtime.ts', '.github/workflows/test-field-updates.yml', '.github/workflows/sandbox-auth-modes.yml', 'package*.json']
  pull_request:
    paths:
      - 'scripts/prepare-field-parser.mjs'
      - 'src/automations/field-updates/**'
      - 'src/automations/link-pr-to-project/LinkPrToProject.ts'
      - 'src/automations/safe-dependabot-pr-link/SafeDependabotPrLink.ts'
      - 'src/automations/ensure-next-iteration-reminder/EnsureNextIterationReminder.ts'
      - 'src/github/ClosingReferenceParser.ts'
      - 'src/github/FieldController.ts'
      - 'src/github/IssueRepository.ts'
      - 'src/github/ProjectV2Repository.ts'
      - 'src/github/PullRequestRepository.ts'
      - 'src/runtime/**'
      - 'itest/field-updates.ts'
      - 'itest/runtime.ts'
      - '.github/workflows/test-field-updates.yml'
      - '.github/workflows/sandbox-auth-modes.yml'
      - 'package*.json'

permissions:
  contents: read

concurrency:
  group: integration-org-sandbox
  queue: max
  cancel-in-progress: false

jobs:
  auth-modes:
    uses: ./.github/workflows/sandbox-auth-modes.yml
    with:
      requested_mode: ${{ inputs.auth_mode || '' }}

  test-fields:
    needs: auth-modes
    if: needs.auth-modes.outputs.modes != ''
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        auth_mode: ${{ fromJSON(needs.auth-modes.outputs.modes) }}
    env:
      AUTH_MODE: ${{ matrix.auth_mode }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - uses: actions/create-github-app-token@v3
        if: ${{ env.AUTH_MODE == 'app' }}
        id: app-token
        with:
          app-id: ${{ secrets.ORG_AUTOMATION_APP_ID }}
          private-key: ${{ secrets.ORG_AUTOMATION_APP_PRIVATE_KEY }}
          owner: ViRGiL-GH-Productivity
      - name: Exercise real native and project APIs and both PR paths
        uses: actions/github-script@v9
        with:
          github-token: ${{ steps.app-token.outputs.token || (matrix.auth_mode == 'pat' && secrets.CI_SANDBOX_TOKEN) || '' }}
          script: |
            const { run } = await import('${{ github.workspace }}/itest/field-updates.ts');
            await run({ github, context, core });
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: field-updates-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.auth_mode }}
          path: field-updates-result.json
          if-no-files-found: warn
