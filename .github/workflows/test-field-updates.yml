name: Test field updates

on:
  workflow_dispatch:
    inputs:
      auth_mode:
        description: Token source for org sandbox (pat or app)
        required: false
        default: pat
        type: choice
        options: [pat, app]
  push:
    branches: [gff-pr-field-updates]
    paths: ['src/**', 'itest/field-updates.ts', 'itest/runtime.ts', '.github/workflows/test-field-updates.yml', 'package*.json']
  pull_request:
    paths: ['src/github/FieldController.ts', 'src/automations/field-updates/**', 'itest/field-updates.ts', 'itest/runtime.ts', '.github/workflows/test-field-updates.yml', 'package*.json']

permissions:
  contents: read

concurrency:
  group: integration-org-sandbox
  queue: max
  cancel-in-progress: false

env:
  AUTH_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.auth_mode || 'pat' }}

jobs:
  test-fields:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - name: Normalize existing App key
        if: ${{ env.AUTH_MODE == 'app' }}
        id: normalize-key
        shell: bash
        env:
          RAW_PRIVATE_KEY: ${{ secrets.ORG_AUTOMATION_APP_PRIVATE_KEY }}
        run: |
          NORMALIZED_KEY=$(printf '%b' "$RAW_PRIVATE_KEY")
          while IFS= read -r line; do
            printf '::add-mask::%s\n' "$line"
          done <<< "$NORMALIZED_KEY"
          printf 'private_key<<EOF\n%s\nEOF\n' "$NORMALIZED_KEY" >> "$GITHUB_OUTPUT"
      - uses: actions/create-github-app-token@v3
        if: ${{ env.AUTH_MODE == 'app' }}
        id: app-token
        with:
          app-id: ${{ secrets.ORG_AUTOMATION_APP_ID }}
          private-key: ${{ steps.normalize-key.outputs.private_key }}
          owner: ViRGiL-GH-Productivity
      - name: Exercise real native and project APIs and both PR paths
        uses: actions/github-script@v8
        with:
          github-token: ${{ env.AUTH_MODE == 'app' && steps.app-token.outputs.token || secrets.CI_SANDBOX_TOKEN }}
          script: |
            const { run } = await import('${{ github.workspace }}/itest/field-updates.ts');
            await run({ github, context, core });
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: field-updates-${{ github.run_id }}-${{ github.run_attempt }}
          path: field-updates-result.json
          if-no-files-found: warn
