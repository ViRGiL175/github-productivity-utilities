# Integration test: создаёт issue и PR, проверяет привязку PR к Project V2,
# перенос sprint и assignee из issue, позднюю closing reference, перевод в Need Review
# при запросе human-reviewer и установку статуса Done при закрытии, плюс cleanup.
# В `pat`-режиме issue и PR живут в одном репозитории.
# В `app`-режиме issue живёт в backlog-репозитории, а PR — в отдельном client-репозитории.
name: Test link-pr-to-project

on:
  workflow_dispatch:
    inputs:
      auth_mode:
        description: Token source to use for integration tests (pat=user sandbox, app=org sandbox)
        required: false
        default: pat
        type: choice
        options:
          - pat
          - app
  pull_request:
    paths:
      - '.github/workflows/link-pr-to-project.yml'
      - '.github/workflows/test-link-pr-to-project.yml'
      - 'src/**'
      - 'test/**'

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: read
  pull-requests: read

env:
  AUTH_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.auth_mode || 'pat' }}
  INSTALLATION_OWNER: ${{ github.event_name == 'workflow_dispatch' && inputs.auth_mode == 'app' && 'ViRGiL-GH-Productivity' || 'ViRGiL175' }}
  PROJECT_OWNER: ${{ github.event_name == 'workflow_dispatch' && inputs.auth_mode == 'app' && 'ViRGiL-GH-Productivity' || 'ViRGiL175' }}
  PROJECT_NUMBER: ${{ github.event_name == 'workflow_dispatch' && inputs.auth_mode == 'app' && '1' || '10' }}
  ITERATION_FIELD_NAME: Iteration
  STATUS_FIELD_NAME: Status
  STATUS_DONE_VALUE: Done
  BACKLOG_REPO_OWNER: ${{ github.event_name == 'workflow_dispatch' && inputs.auth_mode == 'app' && 'ViRGiL-GH-Productivity' || 'ViRGiL175' }}
  BACKLOG_REPO_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.auth_mode == 'app' && 'scrum-test-backlog' || 'github-productivity-utilities' }}
  PULL_REQUEST_REPO_OWNER: ${{ github.event_name == 'workflow_dispatch' && inputs.auth_mode == 'app' && 'ViRGiL-GH-Productivity' || 'ViRGiL175' }}
  PULL_REQUEST_REPO_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.auth_mode == 'app' && 'test-client' || 'github-productivity-utilities' }}
  DEFAULT_BRANCH: main

jobs:
  resolve-auth:
    name: Resolve integration auth token
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    uses: ./.github/workflows/resolve-integration-test-token.yml
    with:
      auth_mode: ${{ github.event_name == 'workflow_dispatch' && inputs.auth_mode || 'pat' }}
      installation_owner: ${{ github.event_name == 'workflow_dispatch' && inputs.auth_mode == 'app' && 'ViRGiL-GH-Productivity' || 'ViRGiL175' }}
    secrets:
      pat_token: ${{ secrets.ORG_PROJECT_TOKEN }}
      app_id: ${{ secrets.ORG_AUTOMATION_APP_ID }}
      app_private_key: ${{ secrets.ORG_AUTOMATION_APP_PRIVATE_KEY }}

  prepare-link-scenario:
    name: Prepare link PR scenario
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    needs:
      - resolve-auth
    outputs:
      project_id: ${{ steps.prepare.outputs.project_id }}
      iteration_field_id: ${{ steps.prepare.outputs.iteration_field_id }}
      status_field_id: ${{ steps.prepare.outputs.status_field_id }}
      target_iteration_id: ${{ steps.prepare.outputs.target_iteration_id }}
      latest_iteration_id: ${{ steps.prepare.outputs.latest_iteration_id }}
      status_in_progress_value: ${{ steps.prepare.outputs.status_in_progress_value }}
      status_in_review_value: ${{ steps.prepare.outputs.status_in_review_value }}
      issue_number: ${{ steps.prepare.outputs.issue_number }}
      issue_node_id: ${{ steps.prepare.outputs.issue_node_id }}
      pull_number: ${{ steps.prepare.outputs.pull_number }}
      pull_node_id: ${{ steps.prepare.outputs.pull_node_id }}
      branch_name: ${{ steps.prepare.outputs.branch_name }}
      closes_ref: ${{ steps.prepare.outputs.closes_ref }}
      issue_assignee_login: ${{ steps.prepare.outputs.issue_assignee_login }}
      backlog_repo_owner: ${{ steps.prepare.outputs.backlog_repo_owner }}
      backlog_repo_name: ${{ steps.prepare.outputs.backlog_repo_name }}
      pull_request_repo_owner: ${{ steps.prepare.outputs.pull_request_repo_owner }}
      pull_request_repo_name: ${{ steps.prepare.outputs.pull_request_repo_name }}
    steps:
      - name: Normalize GitHub App private key
        if: ${{ env.AUTH_MODE == 'app' }}
        id: normalize-key
        shell: bash
        env:
          RAW_PRIVATE_KEY: ${{ secrets.ORG_AUTOMATION_APP_PRIVATE_KEY }}
        run: |
          NORMALIZED_KEY=$(printf '%b' "$RAW_PRIVATE_KEY")
          while IFS= read -r line; do
            printf '::add-mask::%s\n' "$line"
          done <<< "$NORMALIZED_KEY"
          printf 'private_key<<EOF\n%s\nEOF\n' "$NORMALIZED_KEY" >> "$GITHUB_OUTPUT"

      - name: Create GitHub App installation token
        if: ${{ env.AUTH_MODE == 'app' }}
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.ORG_AUTOMATION_APP_ID }}
          private-key: ${{ steps.normalize-key.outputs.private_key }}
          owner: ${{ env.INSTALLATION_OWNER }}
          skip-token-revoke: true

      - name: Resolve job auth token
        id: auth
        shell: bash
        env:
          DIRECT_TOKEN: ${{ secrets.ORG_PROJECT_TOKEN }}
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          case "$AUTH_MODE" in
            pat)
              TOKEN="$DIRECT_TOKEN"
              ;;
            app)
              TOKEN="$APP_TOKEN"
              ;;
            *)
              echo "Unsupported auth mode: $AUTH_MODE" >&2
              exit 1
              ;;
          esac

          if [ -z "$TOKEN" ]; then
            echo "Resolved token is empty for auth_mode=$AUTH_MODE" >&2
            exit 1
          fi

          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Create issue, project item, branch, and PR
        id: prepare
        uses: actions/github-script@v8
        env:
          PROJECT_OWNER: ${{ env.PROJECT_OWNER }}
          PROJECT_NUMBER: ${{ env.PROJECT_NUMBER }}
          ITERATION_FIELD_NAME: ${{ env.ITERATION_FIELD_NAME }}
          STATUS_FIELD_NAME: ${{ env.STATUS_FIELD_NAME }}
          STATUS_DONE_VALUE: ${{ env.STATUS_DONE_VALUE }}
          BACKLOG_REPO_OWNER: ${{ env.BACKLOG_REPO_OWNER }}
          BACKLOG_REPO_NAME: ${{ env.BACKLOG_REPO_NAME }}
          PULL_REQUEST_REPO_OWNER: ${{ env.PULL_REQUEST_REPO_OWNER }}
          PULL_REQUEST_REPO_NAME: ${{ env.PULL_REQUEST_REPO_NAME }}
          DEFAULT_BRANCH: ${{ env.DEFAULT_BRANCH }}
          ISSUE_TITLE: ITEST-${{ github.run_id }} link issue
          PR_TITLE: ITEST-${{ github.run_id }} link PR
          FILE_PATH: itest/link-${{ github.run_id }}.txt
        with:
          github-token: ${{ steps.auth.outputs.token }}
          script: |
            const projectOwner = process.env.PROJECT_OWNER;
            const projectNumber = Number(process.env.PROJECT_NUMBER);
            const iterationFieldName = process.env.ITERATION_FIELD_NAME;
            const statusFieldName = process.env.STATUS_FIELD_NAME;
            const statusDoneValue = process.env.STATUS_DONE_VALUE;
            const backlogRepoOwner = process.env.BACKLOG_REPO_OWNER;
            const backlogRepoName = process.env.BACKLOG_REPO_NAME;
            const pullRequestRepoOwner = process.env.PULL_REQUEST_REPO_OWNER;
            const pullRequestRepoName = process.env.PULL_REQUEST_REPO_NAME;
            const defaultBranch = process.env.DEFAULT_BRANCH;
            const issueTitle = process.env.ISSUE_TITLE;
            const prTitle = process.env.PR_TITLE;
            const filePath = process.env.FILE_PATH;

            const headers = {
              accept: 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
            };

            const ORGANIZATION_PROJECT_QUERY = `
              query($owner: String!, $number: Int!) {
                organization(login: $owner) {
                  projectV2(number: $number) {
                    id
                    fields(first: 100) {
                      nodes {
                        __typename
                        ... on ProjectV2FieldCommon {
                          id
                          name
                        }
                        ... on ProjectV2IterationField {
                          configuration {
                            completedIterations {
                              id
                              title
                              startDate
                              duration
                            }
                            iterations {
                              id
                              title
                              startDate
                              duration
                            }
                          }
                        }
                        ... on ProjectV2SingleSelectField {
                          options {
                            id
                            name
                          }
                        }
                      }
                    }
                  }
                }
              }
            `;

            const USER_PROJECT_QUERY = `
              query($owner: String!, $number: Int!) {
                user(login: $owner) {
                  projectV2(number: $number) {
                    id
                    fields(first: 100) {
                      nodes {
                        __typename
                        ... on ProjectV2FieldCommon {
                          id
                          name
                        }
                        ... on ProjectV2IterationField {
                          configuration {
                            completedIterations {
                              id
                              title
                              startDate
                              duration
                            }
                            iterations {
                              id
                              title
                              startDate
                              duration
                            }
                          }
                        }
                        ... on ProjectV2SingleSelectField {
                          options {
                            id
                            name
                          }
                        }
                      }
                    }
                  }
                }
              }
            `;

            const ADD_PROJECT_ITEM_MUTATION = `
              mutation($projectId: ID!, $contentId: ID!) {
                addProjectV2ItemById(input: { projectId: $projectId, contentId: $contentId }) {
                  item {
                    id
                  }
                }
              }
            `;

            const UPDATE_ITERATION_MUTATION = `
              mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $iterationId: String!) {
                updateProjectV2ItemFieldValue(input: {
                  projectId: $projectId
                  itemId: $itemId
                  fieldId: $fieldId
                  value: { iterationId: $iterationId }
                }) {
                  projectV2Item {
                    id
                  }
                }
              }
            `;

            function toUtcDate(value) {
              return new Date(`${value}T00:00:00Z`);
            }

            function sortIterations(iterations) {
              return [...iterations].sort((a, b) => toUtcDate(a.startDate) - toUtcDate(b.startDate));
            }

            function pickPreferredOption(optionNames, preferredNames, excludedNames = []) {
              const excluded = new Set(excludedNames.filter(Boolean));

              for (const candidate of preferredNames) {
                if (optionNames.includes(candidate) && !excluded.has(candidate)) {
                  return candidate;
                }
              }

              return optionNames.find((name) => !excluded.has(name)) ?? null;
            }

            async function listRepoAssigneeLogins(owner, repo) {
              const assignees = await github.paginate('GET /repos/{owner}/{repo}/assignees', {
                owner,
                repo,
                per_page: 100,
                headers,
              });

              return (assignees ?? [])
                .map((assignee) => assignee?.login)
                .filter(Boolean);
            }

            async function getProjectOwnerType(login) {
              const response = await github.request('GET /users/{username}', {
                username: login,
                headers: {
                  accept: 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                },
              });

              return response.data.type;
            }

            async function getProjectMetadata() {
              const ownerType = await getProjectOwnerType(projectOwner);
              const query = ownerType === 'Organization' ? ORGANIZATION_PROJECT_QUERY : USER_PROJECT_QUERY;

              const data = await github.graphql(query, {
                owner: projectOwner,
                number: projectNumber,
              });

              const project = ownerType === 'Organization'
                ? data.organization?.projectV2
                : data.user?.projectV2;

              if (!project) {
                throw new Error(`Project ${projectOwner}#${projectNumber} was not found.`);
              }

              const iterationField = project.fields.nodes.find((field) =>
                field?.__typename === 'ProjectV2IterationField' && field.name === iterationFieldName,
              );
              if (!iterationField) {
                throw new Error(`Iteration field "${iterationFieldName}" was not found in project ${projectOwner}#${projectNumber}.`);
              }

              const statusField = project.fields.nodes.find((field) =>
                field?.__typename === 'ProjectV2SingleSelectField' && field.name === statusFieldName,
              );
              if (!statusField) {
                throw new Error(`Status field "${statusFieldName}" was not found in project ${projectOwner}#${projectNumber}.`);
              }

              const iterations = sortIterations([
                ...(iterationField.configuration?.iterations ?? []),
                ...(iterationField.configuration?.completedIterations ?? []),
              ]).filter((iteration) => iteration.startDate);

              if (iterations.length < 2) {
                throw new Error('Need at least two iterations in the sandbox project to test latest-sprint selection.');
              }

              const statusOptionNames = (statusField.options ?? []).map((option) => option.name);
              if (!statusOptionNames.includes(statusDoneValue)) {
                throw new Error(`Status option "${statusDoneValue}" was not found in field ${statusFieldName} of project ${projectOwner}#${projectNumber}.`);
              }

              const nonDoneStatusNames = statusOptionNames.filter((name) => name !== statusDoneValue);
              if (nonDoneStatusNames.length === 0) {
                throw new Error(`Need at least one non-${statusDoneValue} option in field ${statusFieldName} to run link-pr-to-project integration tests.`);
              }

              const statusInProgressValue = pickPreferredOption(
                nonDoneStatusNames,
                ['In Progress', 'Doing', 'Active', 'Planned', 'Todo', 'To Do', 'Backlog'],
              );
              const statusInReviewValue = pickPreferredOption(
                nonDoneStatusNames,
                ['Need Review', 'In Review', 'Review', 'Ready for Review'],
                [statusInProgressValue],
              ) ?? statusInProgressValue;

              return {
                projectId: project.id,
                iterationFieldId: iterationField.id,
                statusFieldId: statusField.id,
                targetIterationId: iterations[0].id,
                latestIterationId: iterations[iterations.length - 1].id,
                statusInProgressValue,
                statusInReviewValue,
              };
            }

            async function addIssueToProject(projectId, issueNodeId) {
              const data = await github.graphql(ADD_PROJECT_ITEM_MUTATION, {
                projectId,
                contentId: issueNodeId,
              });

              return data.addProjectV2ItemById.item.id;
            }

            async function setIteration(projectId, itemId, fieldId, iterationId) {
              await github.graphql(UPDATE_ITERATION_MUTATION, {
                projectId,
                itemId,
                fieldId,
                iterationId,
              });
            }

            const project = await getProjectMetadata();
            const backlogRepoAssignees = await listRepoAssigneeLogins(backlogRepoOwner, backlogRepoName);
            const pullRequestRepoAssignees = new Set(await listRepoAssigneeLogins(pullRequestRepoOwner, pullRequestRepoName));
            const issueAssigneeLogin = backlogRepoAssignees.find((login) => pullRequestRepoAssignees.has(login)) ?? null;

            if (!issueAssigneeLogin) {
              throw new Error(`Need at least one common assignable user between ${backlogRepoOwner}/${backlogRepoName} and ${pullRequestRepoOwner}/${pullRequestRepoName} to run link-pr-to-project integration tests.`);
            }

            const issueResponse = await github.request('POST /repos/{owner}/{repo}/issues', {
              owner: backlogRepoOwner,
              repo: backlogRepoName,
              title: issueTitle,
              body: `ITEST run ${context.runId} for link-pr-to-project issue`,
              assignees: [issueAssigneeLogin],
              headers,
            });
            const issue = issueResponse.data;

            const issueProjectItemId = await addIssueToProject(project.projectId, issue.node_id);
            await setIteration(project.projectId, issueProjectItemId, project.iterationFieldId, project.targetIterationId);

            const branchName = `${issue.number}-itest-${context.runId}`;
            const baseRef = await github.request('GET /repos/{owner}/{repo}/git/ref/{ref}', {
              owner: pullRequestRepoOwner,
              repo: pullRequestRepoName,
              ref: `heads/${defaultBranch}`,
              headers,
            });

            await github.request('POST /repos/{owner}/{repo}/git/refs', {
              owner: pullRequestRepoOwner,
              repo: pullRequestRepoName,
              ref: `refs/heads/${branchName}`,
              sha: baseRef.data.object.sha,
              headers,
            });

            await github.request('PUT /repos/{owner}/{repo}/contents/{path}', {
              owner: pullRequestRepoOwner,
              repo: pullRequestRepoName,
              path: filePath,
              message: `ITEST link fixture ${context.runId}`,
              content: Buffer.from(`link fixture for run ${context.runId}\n`).toString('base64'),
              branch: branchName,
              headers,
            });

            const pullResponse = await github.request('POST /repos/{owner}/{repo}/pulls', {
              owner: pullRequestRepoOwner,
              repo: pullRequestRepoName,
              title: prTitle,
              head: branchName,
              base: defaultBranch,
              body: `ITEST run ${context.runId} for link-pr-to-project`,
              headers,
            });
            const pullRequest = pullResponse.data;

            const pullItemId = await addIssueToProject(project.projectId, pullRequest.node_id);
            await github.graphql(`
              mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!) {
                clearProjectV2ItemFieldValue(input: { projectId: $projectId, itemId: $itemId, fieldId: $fieldId }) {
                  projectV2Item { id }
                }
              }
            `, { projectId: project.projectId, itemId: pullItemId, fieldId: project.statusFieldId });

            core.setOutput('project_id', project.projectId);
            core.setOutput('iteration_field_id', project.iterationFieldId);
            core.setOutput('status_field_id', project.statusFieldId);
            core.setOutput('target_iteration_id', project.targetIterationId);
            core.setOutput('latest_iteration_id', project.latestIterationId);
            core.setOutput('status_in_progress_value', project.statusInProgressValue);
            core.setOutput('status_in_review_value', project.statusInReviewValue);
            core.setOutput('issue_number', String(issue.number));
            core.setOutput('issue_node_id', issue.node_id);
            core.setOutput('pull_number', String(pullRequest.number));
            core.setOutput('pull_node_id', pullRequest.node_id);
            core.setOutput('branch_name', branchName);
            core.setOutput('closes_ref', `Closes ${backlogRepoOwner}/${backlogRepoName}#${issue.number}`);
            core.setOutput('issue_assignee_login', issueAssigneeLogin);
            core.setOutput('backlog_repo_owner', backlogRepoOwner);
            core.setOutput('backlog_repo_name', backlogRepoName);
            core.setOutput('pull_request_repo_owner', pullRequestRepoOwner);
            core.setOutput('pull_request_repo_name', pullRequestRepoName);
            core.info(`Selected sandbox statuses: in-progress="${project.statusInProgressValue}", in-review="${project.statusInReviewValue}", done="${statusDoneValue}". Issue assignee: @${issueAssigneeLogin}.`);

  run-preadded-unlinked-scenario:
    name: Set status on a pre-added unlinked PR
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    needs:
      - prepare-link-scenario
    uses: ./.github/workflows/link-pr-to-project.yml
    with:
      project_owner: ${{ github.event_name == 'workflow_dispatch' && inputs.auth_mode == 'app' && 'ViRGiL-GH-Productivity' || 'ViRGiL175' }}
      project_number: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.auth_mode == 'app' && '1' || '10') }}
      backlog_repo: ${{ needs.prepare-link-scenario.outputs.backlog_repo_name }}
      backlog_repo_owner: ${{ needs.prepare-link-scenario.outputs.backlog_repo_owner }}
      iteration_field_name: Iteration
      status_field_name: Status
      status_done_value: Done
      status_in_progress_value: ${{ needs.prepare-link-scenario.outputs.status_in_progress_value }}
      pull_request_node_id: ${{ needs.prepare-link-scenario.outputs.pull_node_id }}
      pull_request_number: ${{ needs.prepare-link-scenario.outputs.pull_number }}
      pull_request_repo_owner: ${{ needs.prepare-link-scenario.outputs.pull_request_repo_owner }}
      pull_request_repo_name: ${{ needs.prepare-link-scenario.outputs.pull_request_repo_name }}
      head_ref: unlinked-itest-${{ github.run_id }}
      action: opened
      auth_mode: ${{ github.event_name == 'workflow_dispatch' && inputs.auth_mode || 'pat' }}
      installation_owner: ${{ github.event_name == 'workflow_dispatch' && inputs.auth_mode == 'app' && 'ViRGiL-GH-Productivity' || 'ViRGiL175' }}
    secrets:
      pat_token: ${{ secrets.ORG_PROJECT_TOKEN }}
      app_id: ${{ secrets.ORG_AUTOMATION_APP_ID }}
      app_private_key: ${{ secrets.ORG_AUTOMATION_APP_PRIVATE_KEY }}

  assert-preadded-unlinked-scenario:
    name: Assert pre-added unlinked PR starts in progress
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    needs:
      - prepare-link-scenario
      - run-preadded-unlinked-scenario
    runs-on: ubuntu-latest
    steps:
      - name: Normalize GitHub App private key
        if: ${{ env.AUTH_MODE == 'app' }}
        id: normalize-key
        shell: bash
        env:
          RAW_PRIVATE_KEY: ${{ secrets.ORG_AUTOMATION_APP_PRIVATE_KEY }}
        run: |
          NORMALIZED_KEY=$(printf '%b' "$RAW_PRIVATE_KEY")
          while IFS= read -r line; do
            printf '::add-mask::%s\n' "$line"
          done <<< "$NORMALIZED_KEY"
          printf 'private_key<<EOF\n%s\nEOF\n' "$NORMALIZED_KEY" >> "$GITHUB_OUTPUT"

      - name: Create GitHub App installation token
        if: ${{ env.AUTH_MODE == 'app' }}
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.ORG_AUTOMATION_APP_ID }}
          private-key: ${{ steps.normalize-key.outputs.private_key }}
          owner: ${{ env.INSTALLATION_OWNER }}
          skip-token-revoke: true

      - name: Assert status was initialized
        uses: actions/github-script@v8
        env:
          PROJECT_ID: ${{ needs.prepare-link-scenario.outputs.project_id }}
          STATUS_FIELD_NAME: ${{ env.STATUS_FIELD_NAME }}
          STATUS_IN_PROGRESS_VALUE: ${{ needs.prepare-link-scenario.outputs.status_in_progress_value }}
          PULL_NODE_ID: ${{ needs.prepare-link-scenario.outputs.pull_node_id }}
        with:
          github-token: ${{ env.AUTH_MODE == 'app' && steps.app-token.outputs.token || secrets.ORG_PROJECT_TOKEN }}
          script: |
            const data = await github.graphql(`
              query($pullId: ID!, $fieldName: String!) {
                node(id: $pullId) {
                  ... on PullRequest { projectItems(first: 100) { nodes {
                    project { id }
                    status: fieldValueByName(name: $fieldName) { ... on ProjectV2ItemFieldSingleSelectValue { name } }
                  } } }
                }
              }
            `, { pullId: process.env.PULL_NODE_ID, fieldName: process.env.STATUS_FIELD_NAME });
            const item = data.node?.projectItems?.nodes?.find((candidate) => candidate.project?.id === process.env.PROJECT_ID);
            if (item?.status?.name !== process.env.STATUS_IN_PROGRESS_VALUE) {
              throw new Error(`Expected initial PR status ${process.env.STATUS_IN_PROGRESS_VALUE}, got ${item?.status?.name || 'none'}.`);
            }

  run-link-open-scenario:
    name: Run link PR open scenario
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    needs:
      - resolve-auth
      - prepare-link-scenario
      - assert-preadded-unlinked-scenario
    uses: ./.github/workflows/link-pr-to-project.yml
    with:
      project_owner: ${{ github.event_name == 'workflow_dispatch' && inputs.auth_mode == 'app' && 'ViRGiL-GH-Productivity' || 'ViRGiL175' }}
      project_number: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.auth_mode == 'app' && '1' || '10') }}
      backlog_repo: ${{ needs.prepare-link-scenario.outputs.backlog_repo_name }}
      backlog_repo_owner: ${{ needs.prepare-link-scenario.outputs.backlog_repo_owner }}
      iteration_field_name: Iteration
      status_field_name: Status
      status_done_value: Done
      status_in_progress_value: ${{ needs.prepare-link-scenario.outputs.status_in_progress_value }}
      status_in_review_value: ${{ needs.prepare-link-scenario.outputs.status_in_review_value }}
      pull_request_node_id: ${{ needs.prepare-link-scenario.outputs.pull_node_id }}
      pull_request_number: ${{ needs.prepare-link-scenario.outputs.pull_number }}
      pull_request_repo_owner: ${{ needs.prepare-link-scenario.outputs.pull_request_repo_owner }}
      pull_request_repo_name: ${{ github.event_name == 'workflow_dispatch' && inputs.auth_mode == 'app' && needs.prepare-link-scenario.outputs.pull_request_repo_name || '' }}
      head_ref: ${{ needs.prepare-link-scenario.outputs.branch_name }}
      action: opened
      auth_mode: ${{ github.event_name == 'workflow_dispatch' && inputs.auth_mode || 'pat' }}
      installation_owner: ${{ github.event_name == 'workflow_dispatch' && inputs.auth_mode == 'app' && 'ViRGiL-GH-Productivity' || 'ViRGiL175' }}
    secrets:
      pat_token: ${{ secrets.ORG_PROJECT_TOKEN }}
      app_id: ${{ secrets.ORG_AUTOMATION_APP_ID }}
      app_private_key: ${{ secrets.ORG_AUTOMATION_APP_PRIVATE_KEY }}

  assert-link-open-scenario:
    name: Assert link PR open scenario
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    needs:
      - resolve-auth
      - prepare-link-scenario
      - run-link-open-scenario
    runs-on: ubuntu-latest
    steps:
      - name: Normalize GitHub App private key
        if: ${{ env.AUTH_MODE == 'app' }}
        id: normalize-key
        shell: bash
        env:
          RAW_PRIVATE_KEY: ${{ secrets.ORG_AUTOMATION_APP_PRIVATE_KEY }}
        run: |
          NORMALIZED_KEY=$(printf '%b' "$RAW_PRIVATE_KEY")
          while IFS= read -r line; do
            printf '::add-mask::%s\n' "$line"
          done <<< "$NORMALIZED_KEY"
          printf 'private_key<<EOF\n%s\nEOF\n' "$NORMALIZED_KEY" >> "$GITHUB_OUTPUT"

      - name: Create GitHub App installation token
        if: ${{ env.AUTH_MODE == 'app' }}
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.ORG_AUTOMATION_APP_ID }}
          private-key: ${{ steps.normalize-key.outputs.private_key }}
          owner: ${{ env.INSTALLATION_OWNER }}
          skip-token-revoke: true

      - name: Resolve job auth token
        id: auth
        shell: bash
        env:
          DIRECT_TOKEN: ${{ secrets.ORG_PROJECT_TOKEN }}
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          case "$AUTH_MODE" in
            pat)
              TOKEN="$DIRECT_TOKEN"
              ;;
            app)
              TOKEN="$APP_TOKEN"
              ;;
            *)
              echo "Unsupported auth mode: $AUTH_MODE" >&2
              exit 1
              ;;
          esac

          if [ -z "$TOKEN" ]; then
            echo "Resolved token is empty for auth_mode=$AUTH_MODE" >&2
            exit 1
          fi

          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Assert PR was linked to project and issue sprint
        uses: actions/github-script@v8
        env:
          PROJECT_ID: ${{ needs.prepare-link-scenario.outputs.project_id }}
          ITERATION_FIELD_NAME: ${{ env.ITERATION_FIELD_NAME }}
          TARGET_ITERATION_ID: ${{ needs.prepare-link-scenario.outputs.target_iteration_id }}
          STATUS_FIELD_NAME: ${{ env.STATUS_FIELD_NAME }}
          STATUS_IN_PROGRESS_VALUE: ${{ needs.prepare-link-scenario.outputs.status_in_progress_value }}
          PULL_NODE_ID: ${{ needs.prepare-link-scenario.outputs.pull_node_id }}
          PULL_NUMBER: ${{ needs.prepare-link-scenario.outputs.pull_number }}
          PULL_REQUEST_REPO_OWNER: ${{ needs.prepare-link-scenario.outputs.pull_request_repo_owner }}
          PULL_REQUEST_REPO_NAME: ${{ needs.prepare-link-scenario.outputs.pull_request_repo_name }}
          CLOSES_REF: ${{ needs.prepare-link-scenario.outputs.closes_ref }}
          ISSUE_ASSIGNEE_LOGIN: ${{ needs.prepare-link-scenario.outputs.issue_assignee_login }}
        with:
          github-token: ${{ steps.auth.outputs.token }}
          script: |
            const projectId = process.env.PROJECT_ID;
            const iterationFieldName = process.env.ITERATION_FIELD_NAME;
            const targetIterationId = process.env.TARGET_ITERATION_ID;
            const statusFieldName = process.env.STATUS_FIELD_NAME;
            const statusInProgressValue = process.env.STATUS_IN_PROGRESS_VALUE;
            const pullNodeId = process.env.PULL_NODE_ID;
            const pullNumber = Number(process.env.PULL_NUMBER);
            const owner = process.env.PULL_REQUEST_REPO_OWNER;
            const repo = process.env.PULL_REQUEST_REPO_NAME;
            const closesRef = process.env.CLOSES_REF;
            const expectedAssigneeLogin = process.env.ISSUE_ASSIGNEE_LOGIN;
            const headers = {
              accept: 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
            };

            function sleep(ms) {
              return new Promise((resolve) => setTimeout(resolve, ms));
            }

            function isRetryable(error) {
              const status = error?.status ?? error?.response?.status ?? 0;
              if (status >= 500) {
                return true;
              }

              const message = String(error?.message || '').toLowerCase();
              return message.includes('fetch failed') || message.includes('server error');
            }

            async function withRetry(label, fn, attempts = 8, delayMs = 4000) {
              let lastError;

              for (let attempt = 1; attempt <= attempts; attempt += 1) {
                try {
                  return await fn();
                } catch (error) {
                  lastError = error;
                  const shouldRetry = attempt < attempts && (isRetryable(error) || error instanceof Error);
                  if (!shouldRetry) {
                    throw error;
                  }

                  core.info(`${label} attempt ${attempt}/${attempts} failed: ${error.message}. Retrying in ${delayMs}ms...`);
                  await sleep(delayMs);
                }
              }

              throw lastError;
            }

            const PULL_REQUEST_PROJECT_ITEMS_QUERY = `
              query($nodeId: ID!, $iterationFieldName: String!, $statusFieldName: String!) {
                node(id: $nodeId) {
                  ... on PullRequest {
                    projectItems(first: 100) {
                      nodes {
                        id
                        project {
                          id
                        }
                        fieldValueByName(name: $iterationFieldName) {
                          ... on ProjectV2ItemFieldIterationValue {
                            iterationId
                          }
                        }
                        statusValue: fieldValueByName(name: $statusFieldName) {
                          ... on ProjectV2ItemFieldSingleSelectValue {
                            name
                          }
                        }
                      }
                    }
                  }
                }
              }
            `;

            await withRetry('Assert open scenario', async () => {
              const projectData = await github.graphql(PULL_REQUEST_PROJECT_ITEMS_QUERY, {
                nodeId: pullNodeId,
                iterationFieldName,
                statusFieldName,
              });

              const projectItems = projectData.node?.projectItems?.nodes?.filter((item) => item.project?.id === projectId) ?? [];
              if (projectItems.length !== 1) {
                throw new Error(`Expected exactly one PR project item, got ${projectItems.length}.`);
              }

              const iterationId = projectItems[0].fieldValueByName?.iterationId ?? null;
              if (iterationId !== targetIterationId) {
                throw new Error(`Expected PR iteration ${targetIterationId}, got ${iterationId || 'none'}.`);
              }

              const statusValue = projectItems[0].statusValue?.name ?? null;
              if (statusValue !== statusInProgressValue) {
                throw new Error(`Expected PR status ${statusInProgressValue}, got ${statusValue || 'none'}.`);
              }

              const pullResponse = await github.request('GET /repos/{owner}/{repo}/pulls/{pull_number}', {
                owner,
                repo,
                pull_number: pullNumber,
                headers,
              });
              const body = pullResponse.data.body || '';

              if (!body.includes(closesRef)) {
                throw new Error(`Expected PR body to contain "${closesRef}".`);
              }

              const pullIssueResponse = await github.request('GET /repos/{owner}/{repo}/issues/{issue_number}', {
                owner,
                repo,
                issue_number: pullNumber,
                headers,
              });
              const assigneeLogins = (pullIssueResponse.data.assignees ?? [])
                .map((assignee) => assignee?.login)
                .filter(Boolean);

              if (!assigneeLogins.includes(expectedAssigneeLogin)) {
                throw new Error(`Expected PR assignees to include ${expectedAssigneeLogin}, got ${assigneeLogins.join(', ') || 'none'}.`);
              }
            });

            core.info(`PR #${pullNumber} is in the project, has iteration ${targetIterationId}, status ${statusInProgressValue}, includes the closing reference, and inherited assignee @${expectedAssigneeLogin}.`);

