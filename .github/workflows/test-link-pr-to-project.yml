      pull_request_repo_owner: ${{ needs.prepare-link-scenario.outputs.pull_request_repo_owner }}
      pull_request_repo_name: ${{ needs.prepare-link-scenario.outputs.pull_request_repo_name }}
      head_ref: ${{ needs.prepare-link-scenario.outputs.branch_name }}
      action: review_requested
      requested_reviewers_json: '[{"login":"octocat"},{"login":"github-actions[bot]"},{"login":"Copilot"}]'
      auth_mode: ${{ github.event_name == 'workflow_dispatch' && inputs.auth_mode || 'pat' }}
      installation_owner: ${{ github.event_name == 'workflow_dispatch' && inputs.auth_mode == 'app' && 'ViRGiL-GH-Productivity' || 'ViRGiL175' }}
    secrets:
      pat_token: ${{ secrets.ORG_PROJECT_TOKEN }}
      app_id: ${{ secrets.ORG_AUTOMATION_APP_ID }}
      app_private_key: ${{ secrets.ORG_AUTOMATION_APP_PRIVATE_KEY }}

  assert-link-review-requested-scenario:
    name: Assert link PR review requested scenario
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    needs:
      - resolve-auth
      - prepare-link-scenario
      - run-link-review-requested-scenario
    runs-on: ubuntu-latest
    steps:
      - name: Normalize GitHub App private key
        if: ${{ env.AUTH_MODE == 'app' }}
        id: normalize-key
        shell: bash
        env:
          RAW_PRIVATE_KEY: ${{ secrets.ORG_AUTOMATION_APP_PRIVATE_KEY }}
        run: |
          NORMALIZED_KEY=$(printf '%b' "$RAW_PRIVATE_KEY")
          while IFS= read -r line; do
            printf '::add-mask::%s\n' "$line"
          done <<< "$NORMALIZED_KEY"
          printf 'private_key<<EOF\n%s\nEOF\n' "$NORMALIZED_KEY" >> "$GITHUB_OUTPUT"

      - name: Create GitHub App installation token
        if: ${{ env.AUTH_MODE == 'app' }}
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.ORG_AUTOMATION_APP_ID }}
          private-key: ${{ steps.normalize-key.outputs.private_key }}
          owner: ${{ env.INSTALLATION_OWNER }}
          skip-token-revoke: true

      - name: Resolve job auth token
        id: auth
        shell: bash
        env:
          DIRECT_TOKEN: ${{ secrets.ORG_PROJECT_TOKEN }}
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          case "$AUTH_MODE" in
            pat)
              TOKEN="$DIRECT_TOKEN"
              ;;
            app)
              TOKEN="$APP_TOKEN"
              ;;
            *)
              echo "Unsupported auth mode: $AUTH_MODE" >&2
              exit 1
              ;;
          esac

          if [ -z "$TOKEN" ]; then
            echo "Resolved token is empty for auth_mode=$AUTH_MODE" >&2
            exit 1
          fi

          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Assert PR status is Need Review in project
        uses: actions/github-script@v8
        env:
          PROJECT_ID: ${{ needs.prepare-link-scenario.outputs.project_id }}
          STATUS_FIELD_NAME: ${{ env.STATUS_FIELD_NAME }}
          STATUS_IN_REVIEW_VALUE: ${{ needs.prepare-link-scenario.outputs.status_in_review_value }}
          PULL_NODE_ID: ${{ needs.prepare-link-scenario.outputs.pull_node_id }}
          ISSUE_NODE_ID: ${{ needs.prepare-link-scenario.outputs.issue_node_id }}
          ISSUE_NUMBER: ${{ needs.prepare-link-scenario.outputs.issue_number }}
          ISSUE_ASSIGNEE_LOGIN: ${{ needs.prepare-link-scenario.outputs.issue_assignee_login }}
          BACKLOG_REPO_OWNER: ${{ needs.prepare-link-scenario.outputs.backlog_repo_owner }}
          BACKLOG_REPO_NAME: ${{ needs.prepare-link-scenario.outputs.backlog_repo_name }}
        with:
          github-token: ${{ steps.auth.outputs.token }}
          script: |
            const projectId = process.env.PROJECT_ID;
            const statusFieldName = process.env.STATUS_FIELD_NAME;
            const statusInReviewValue = process.env.STATUS_IN_REVIEW_VALUE;
            const pullNodeId = process.env.PULL_NODE_ID;

            function sleep(ms) {
              return new Promise((resolve) => setTimeout(resolve, ms));
            }

            function isRetryable(error) {
              const status = error?.status ?? error?.response?.status ?? 0;
              if (status >= 500) {
                return true;
              }

              const message = String(error?.message || '').toLowerCase();
              return message.includes('fetch failed') || message.includes('server error');
            }

            async function withRetry(label, fn, attempts = 8, delayMs = 4000) {
              let lastError;

              for (let attempt = 1; attempt <= attempts; attempt += 1) {
                try {
                  return await fn();
                } catch (error) {
                  lastError = error;
                  const shouldRetry = attempt < attempts && (isRetryable(error) || error instanceof Error);
                  if (!shouldRetry) {
                    throw error;
                  }

                  core.info(`${label} attempt ${attempt}/${attempts} failed: ${error.message}. Retrying in ${delayMs}ms...`);
                  await sleep(delayMs);
                }
              }

              throw lastError;
            }

            const PULL_REQUEST_STATUS_QUERY = `
              query($nodeId: ID!, $statusFieldName: String!) {
                node(id: $nodeId) {
                  ... on PullRequest {
                    projectItems(first: 100) {
                      nodes {
                        id
                        project {
                          id
                        }
                        fieldValueByName(name: $statusFieldName) {
                          ... on ProjectV2ItemFieldSingleSelectValue {
                            name
                          }
                        }
                      }
                    }
                  }
                }
              }
            `;

            const projectItem = await withRetry('Assert review requested scenario', async () => {
              const data = await github.graphql(PULL_REQUEST_STATUS_QUERY, {
                nodeId: pullNodeId,
                statusFieldName,
              });

              const item = data.node?.projectItems?.nodes?.find((projectNode) => projectNode.project?.id === projectId) ?? null;
              if (!item) {
                throw new Error('PR project item is missing during review-requested assertion.');
              }

              const statusValue = item.fieldValueByName?.name ?? null;
              if (statusValue !== statusInReviewValue) {
                throw new Error(`Expected PR status ${statusInReviewValue}, got ${statusValue || 'none'}.`);
              }

              return item;
            });

            core.info(`PR project item ${projectItem.id} is marked as ${statusInReviewValue}.`);

            const ISSUE_STATUS_QUERY = PULL_REQUEST_STATUS_QUERY.replace('... on PullRequest', '... on Issue');
            await withRetry('Assert linked issue review status', async () => {
              const data = await github.graphql(ISSUE_STATUS_QUERY, {
                nodeId: process.env.ISSUE_NODE_ID,
                statusFieldName,
              });
              const item = data.node?.projectItems?.nodes?.find((projectNode) => projectNode.project?.id === projectId) ?? null;
              if (item?.fieldValueByName?.name !== statusInReviewValue) {
                throw new Error(`Expected linked issue status ${statusInReviewValue}, got ${item?.fieldValueByName?.name || 'none'}.`);
              }
            });
            const issue = (await github.request('GET /repos/{owner}/{repo}/issues/{issue_number}', {
              owner: process.env.BACKLOG_REPO_OWNER, repo: process.env.BACKLOG_REPO_NAME,
              issue_number: Number(process.env.ISSUE_NUMBER),
            })).data;
            if (!issue.assignees?.some((assignee) => assignee.login === process.env.ISSUE_ASSIGNEE_LOGIN)) {
              throw new Error('Linked issue lost its original assignee.');
            }
            core.info('Linked issue is in review and retains its assignee.');

