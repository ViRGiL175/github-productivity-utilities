  prepare-link-edited-scenario:
    name: Prepare multiple linked sprint scenario
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    needs:
      - resolve-auth
      - prepare-link-scenario
      - assert-link-idempotency-scenario
    runs-on: ubuntu-latest
    outputs:
      secondary_issue_number: ${{ steps.prepare-secondary.outputs.secondary_issue_number }}
      secondary_issue_node_id: ${{ steps.prepare-secondary.outputs.secondary_issue_node_id }}
      unsprinted_issue_number: ${{ steps.prepare-secondary.outputs.unsprinted_issue_number }}
      unsprinted_issue_node_id: ${{ steps.prepare-secondary.outputs.unsprinted_issue_node_id }}
    steps:
      - name: Normalize GitHub App private key
        if: ${{ env.AUTH_MODE == 'app' }}
        id: normalize-key
        shell: bash
        env:
          RAW_PRIVATE_KEY: ${{ secrets.ORG_AUTOMATION_APP_PRIVATE_KEY }}
        run: |
          NORMALIZED_KEY=$(printf '%b' "$RAW_PRIVATE_KEY")
          while IFS= read -r line; do
            printf '::add-mask::%s\n' "$line"
          done <<< "$NORMALIZED_KEY"
          printf 'private_key<<EOF\n%s\nEOF\n' "$NORMALIZED_KEY" >> "$GITHUB_OUTPUT"

      - name: Create GitHub App installation token
        if: ${{ env.AUTH_MODE == 'app' }}
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.ORG_AUTOMATION_APP_ID }}
          private-key: ${{ steps.normalize-key.outputs.private_key }}
          owner: ${{ env.INSTALLATION_OWNER }}
          skip-token-revoke: true

      - name: Resolve job auth token
        id: auth
        shell: bash
        env:
          DIRECT_TOKEN: ${{ secrets.ORG_PROJECT_TOKEN }}
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          if [ "$AUTH_MODE" = "app" ]; then TOKEN="$APP_TOKEN"; else TOKEN="$DIRECT_TOKEN"; fi
          if [ -z "$TOKEN" ]; then echo "Resolved token is empty" >&2; exit 1; fi
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Add a later-sprint issue and clear PR fields before edited event
        id: prepare-secondary
        uses: actions/github-script@v8
        env:
          PROJECT_ID: ${{ needs.prepare-link-scenario.outputs.project_id }}
          ITERATION_FIELD_ID: ${{ needs.prepare-link-scenario.outputs.iteration_field_id }}
          LATEST_ITERATION_ID: ${{ needs.prepare-link-scenario.outputs.latest_iteration_id }}
          STATUS_FIELD_ID: ${{ needs.prepare-link-scenario.outputs.status_field_id }}
          PULL_NODE_ID: ${{ needs.prepare-link-scenario.outputs.pull_node_id }}
          PULL_NUMBER: ${{ needs.prepare-link-scenario.outputs.pull_number }}
          PULL_REQUEST_REPO_OWNER: ${{ needs.prepare-link-scenario.outputs.pull_request_repo_owner }}
          PULL_REQUEST_REPO_NAME: ${{ needs.prepare-link-scenario.outputs.pull_request_repo_name }}
          BACKLOG_REPO_OWNER: ${{ needs.prepare-link-scenario.outputs.backlog_repo_owner }}
          BACKLOG_REPO_NAME: ${{ needs.prepare-link-scenario.outputs.backlog_repo_name }}
        with:
          github-token: ${{ steps.auth.outputs.token }}
          script: |
            const projectId = process.env.PROJECT_ID;
            const iterationFieldId = process.env.ITERATION_FIELD_ID;
            const latestIterationId = process.env.LATEST_ITERATION_ID;
            const statusFieldId = process.env.STATUS_FIELD_ID;
            const pullNodeId = process.env.PULL_NODE_ID;
            const pullNumber = Number(process.env.PULL_NUMBER);
            const pullOwner = process.env.PULL_REQUEST_REPO_OWNER;
            const pullRepo = process.env.PULL_REQUEST_REPO_NAME;
            const backlogOwner = process.env.BACKLOG_REPO_OWNER;
            const backlogRepo = process.env.BACKLOG_REPO_NAME;
            const headers = {
              accept: 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
            };

            const issueResponse = await github.request('POST /repos/{owner}/{repo}/issues', {
              owner: backlogOwner,
              repo: backlogRepo,
              title: `ITEST-${context.runId} later linked sprint issue`,
              body: `ITEST run ${context.runId} for latest linked sprint selection`,
              headers,
            });
            const secondaryIssue = issueResponse.data;
            const added = await github.graphql(`
              mutation($projectId: ID!, $contentId: ID!) {
                addProjectV2ItemById(input: { projectId: $projectId, contentId: $contentId }) {
                  item { id }
                }
              }
            `, { projectId, contentId: secondaryIssue.node_id });
            await github.graphql(`
              mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $iterationId: String!) {
                updateProjectV2ItemFieldValue(input: {
                  projectId: $projectId
                  itemId: $itemId
                  fieldId: $fieldId
                  value: { iterationId: $iterationId }
                }) { projectV2Item { id } }
              }
            `, {
              projectId,
              itemId: added.addProjectV2ItemById.item.id,
              fieldId: iterationFieldId,
              iterationId: latestIterationId,
            });

            const unsprintedIssueResponse = await github.request('POST /repos/{owner}/{repo}/issues', {
              owner: backlogOwner,
              repo: backlogRepo,
              title: `ITEST-${context.runId} unsprinted linked issue`,
              body: `ITEST run ${context.runId} for empty linked sprint selection`,
              headers,
            });
            const unsprintedIssue = unsprintedIssueResponse.data;
            await github.graphql(`
              mutation($projectId: ID!, $contentId: ID!) {
                addProjectV2ItemById(input: { projectId: $projectId, contentId: $contentId }) {
                  item { id }
                }
              }
            `, { projectId, contentId: unsprintedIssue.node_id });

            const data = await github.graphql(`
              query($pullNodeId: ID!) {
                pull: node(id: $pullNodeId) {
                  ... on PullRequest {
                    projectItems(first: 100) { nodes { id project { id } } }
                  }
                }
              }
            `, { pullNodeId });
            const pullItem = data.pull?.projectItems?.nodes?.find((candidate) => candidate.project?.id === projectId);
            if (!pullItem) throw new Error('PR project item is missing before edited scenario.');
            const clearField = (itemId, fieldId) => github.graphql(`
                mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!) {
                  clearProjectV2ItemFieldValue(input: {
                    projectId: $projectId
                    itemId: $itemId
                    fieldId: $fieldId
                  }) { projectV2Item { id } }
                }
              `, { projectId, itemId, fieldId });
            await clearField(pullItem.id, statusFieldId);
            await clearField(pullItem.id, iterationFieldId);

            const pull = await github.request('GET /repos/{owner}/{repo}/pulls/{pull_number}', {
              owner: pullOwner,
              repo: pullRepo,
              pull_number: pullNumber,
              headers,
            });
            const secondaryReference = `Closes https://github.com/${backlogOwner}/${backlogRepo}/issues/${secondaryIssue.number}`;
            const unsprintedReference = `Closes ${backlogOwner}/${backlogRepo}#${unsprintedIssue.number}`;
            await github.request('PATCH /repos/{owner}/{repo}/pulls/{pull_number}', {
              owner: pullOwner,
              repo: pullRepo,
              pull_number: pullNumber,
              body: `${pull.data.body || ''}\n\n${secondaryReference}\n${unsprintedReference}`,
              headers,
            });
            core.setOutput('secondary_issue_number', String(secondaryIssue.number));
            core.setOutput('secondary_issue_node_id', secondaryIssue.node_id);
            core.setOutput('unsprinted_issue_number', String(unsprintedIssue.number));
            core.setOutput('unsprinted_issue_node_id', unsprintedIssue.node_id);
            core.info(`Linked issue #${secondaryIssue.number} in later iteration ${latestIterationId} and unsprinted issue #${unsprintedIssue.number}.`);

  run-link-edited-scenario:
    name: Run multiple linked sprint scenario
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    needs:
      - resolve-auth
      - prepare-link-scenario
      - prepare-link-edited-scenario
    uses: ./.github/workflows/link-pr-to-project.yml
    with:
      project_owner: ${{ github.event_name == 'workflow_dispatch' && inputs.auth_mode == 'app' && 'ViRGiL-GH-Productivity' || 'ViRGiL175' }}
      project_number: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.auth_mode == 'app' && '1' || '10') }}
      backlog_repo: ${{ needs.prepare-link-scenario.outputs.backlog_repo_name }}
      backlog_repo_owner: ${{ needs.prepare-link-scenario.outputs.backlog_repo_owner }}
      iteration_field_name: Iteration
      status_field_name: Status
      status_done_value: Done
      status_in_progress_value: ${{ needs.prepare-link-scenario.outputs.status_in_progress_value }}
      status_in_review_value: ${{ needs.prepare-link-scenario.outputs.status_in_review_value }}
      pull_request_node_id: ${{ needs.prepare-link-scenario.outputs.pull_node_id }}
      pull_request_number: ${{ needs.prepare-link-scenario.outputs.pull_number }}
      pull_request_repo_owner: ${{ needs.prepare-link-scenario.outputs.pull_request_repo_owner }}
      pull_request_repo_name: ${{ needs.prepare-link-scenario.outputs.pull_request_repo_name }}
      head_ref: itest-manual-link-${{ github.run_id }}
      action: edited
      auth_mode: ${{ github.event_name == 'workflow_dispatch' && inputs.auth_mode || 'pat' }}
      installation_owner: ${{ github.event_name == 'workflow_dispatch' && inputs.auth_mode == 'app' && 'ViRGiL-GH-Productivity' || 'ViRGiL175' }}
    secrets:
      pat_token: ${{ secrets.ORG_PROJECT_TOKEN }}
      app_id: ${{ secrets.ORG_AUTOMATION_APP_ID }}
      app_private_key: ${{ secrets.ORG_AUTOMATION_APP_PRIVATE_KEY }}

  assert-link-edited-scenario:
    name: Assert latest linked sprint scenario
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    needs:
      - resolve-auth
      - prepare-link-scenario
      - prepare-link-edited-scenario
      - run-link-edited-scenario
    runs-on: ubuntu-latest
    steps:
      - name: Normalize GitHub App private key
        if: ${{ env.AUTH_MODE == 'app' }}
        id: normalize-key
        shell: bash
        env:
          RAW_PRIVATE_KEY: ${{ secrets.ORG_AUTOMATION_APP_PRIVATE_KEY }}
        run: |
          NORMALIZED_KEY=$(printf '%b' "$RAW_PRIVATE_KEY")
          while IFS= read -r line; do
            printf '::add-mask::%s\n' "$line"
          done <<< "$NORMALIZED_KEY"
          printf 'private_key<<EOF\n%s\nEOF\n' "$NORMALIZED_KEY" >> "$GITHUB_OUTPUT"

      - name: Create GitHub App installation token
        if: ${{ env.AUTH_MODE == 'app' }}
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.ORG_AUTOMATION_APP_ID }}
          private-key: ${{ steps.normalize-key.outputs.private_key }}
          owner: ${{ env.INSTALLATION_OWNER }}
          skip-token-revoke: true

      - name: Resolve job auth token
        id: auth
        shell: bash
        env:
          DIRECT_TOKEN: ${{ secrets.ORG_PROJECT_TOKEN }}
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          if [ "$AUTH_MODE" = "app" ]; then TOKEN="$APP_TOKEN"; else TOKEN="$DIRECT_TOKEN"; fi
          if [ -z "$TOKEN" ]; then echo "Resolved token is empty" >&2; exit 1; fi
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Assert edited event selected the latest linked Sprint
        uses: actions/github-script@v8
        env:
          PROJECT_ID: ${{ needs.prepare-link-scenario.outputs.project_id }}
          ITERATION_FIELD_NAME: ${{ env.ITERATION_FIELD_NAME }}
          STATUS_FIELD_NAME: ${{ env.STATUS_FIELD_NAME }}
          STATUS_IN_PROGRESS_VALUE: ${{ needs.prepare-link-scenario.outputs.status_in_progress_value }}
          PULL_NODE_ID: ${{ needs.prepare-link-scenario.outputs.pull_node_id }}
          PRIMARY_ISSUE_NODE_ID: ${{ needs.prepare-link-scenario.outputs.issue_node_id }}
          SECONDARY_ISSUE_NODE_ID: ${{ needs.prepare-link-edited-scenario.outputs.secondary_issue_node_id }}
          UNSPRINTED_ISSUE_NODE_ID: ${{ needs.prepare-link-edited-scenario.outputs.unsprinted_issue_node_id }}
          PRIMARY_ITERATION_ID: ${{ needs.prepare-link-scenario.outputs.target_iteration_id }}
          LATEST_ITERATION_ID: ${{ needs.prepare-link-scenario.outputs.latest_iteration_id }}
          PULL_NUMBER: ${{ needs.prepare-link-scenario.outputs.pull_number }}
          PULL_REQUEST_REPO_OWNER: ${{ needs.prepare-link-scenario.outputs.pull_request_repo_owner }}
          PULL_REQUEST_REPO_NAME: ${{ needs.prepare-link-scenario.outputs.pull_request_repo_name }}
          CLOSES_REF: ${{ needs.prepare-link-scenario.outputs.closes_ref }}
        with:
          github-token: ${{ steps.auth.outputs.token }}
          script: |
            const query = `
              query($pullNodeId: ID!, $primaryIssueNodeId: ID!, $secondaryIssueNodeId: ID!, $unsprintedIssueNodeId: ID!, $statusFieldName: String!, $iterationFieldName: String!) {
                pull: node(id: $pullNodeId) {
                  ... on PullRequest {
                    projectItems(first: 100) {
                      nodes {
                        project { id }
                        status: fieldValueByName(name: $statusFieldName) {
                          ... on ProjectV2ItemFieldSingleSelectValue { name }
                        }
                        iteration: fieldValueByName(name: $iterationFieldName) {
                          ... on ProjectV2ItemFieldIterationValue { iterationId }
                        }
                      }
                    }
                  }
                }
                primaryIssue: node(id: $primaryIssueNodeId) {
                  ... on Issue {
                    projectItems(first: 100) {
                      nodes {
                        project { id }
                        iteration: fieldValueByName(name: $iterationFieldName) {
                          ... on ProjectV2ItemFieldIterationValue { iterationId }
                        }
                      }
                    }
                  }
                }
                secondaryIssue: node(id: $secondaryIssueNodeId) {
                  ... on Issue {
                    projectItems(first: 100) {
                      nodes {
                        project { id }
                        iteration: fieldValueByName(name: $iterationFieldName) {
                          ... on ProjectV2ItemFieldIterationValue { iterationId }
                        }
                      }
                    }
                  }
                }
                unsprintedIssue: node(id: $unsprintedIssueNodeId) {
                  ... on Issue {
                    projectItems(first: 100) {
                      nodes {
                        project { id }
                        iteration: fieldValueByName(name: $iterationFieldName) {
                          ... on ProjectV2ItemFieldIterationValue { iterationId }
                        }
                      }
                    }
                  }
                }
              }
            `;
            const data = await github.graphql(query, {
              pullNodeId: process.env.PULL_NODE_ID,
              primaryIssueNodeId: process.env.PRIMARY_ISSUE_NODE_ID,
              secondaryIssueNodeId: process.env.SECONDARY_ISSUE_NODE_ID,
              unsprintedIssueNodeId: process.env.UNSPRINTED_ISSUE_NODE_ID,
              statusFieldName: process.env.STATUS_FIELD_NAME,
              iterationFieldName: process.env.ITERATION_FIELD_NAME,
            });
            const pullItem = data.pull?.projectItems?.nodes?.find((candidate) => candidate.project?.id === process.env.PROJECT_ID);
            const primaryIssueItem = data.primaryIssue?.projectItems?.nodes?.find((candidate) => candidate.project?.id === process.env.PROJECT_ID);
            const secondaryIssueItem = data.secondaryIssue?.projectItems?.nodes?.find((candidate) => candidate.project?.id === process.env.PROJECT_ID);
            const unsprintedIssueItem = data.unsprintedIssue?.projectItems?.nodes?.find((candidate) => candidate.project?.id === process.env.PROJECT_ID);
            const status = pullItem?.status?.name ?? null;
            if (status !== process.env.STATUS_IN_PROGRESS_VALUE) {
              throw new Error(`Expected edited PR status ${process.env.STATUS_IN_PROGRESS_VALUE}, got ${status || 'none'}.`);
            }
            if (pullItem?.iteration?.iterationId !== process.env.LATEST_ITERATION_ID) {
              throw new Error(`Expected PR Sprint ${process.env.LATEST_ITERATION_ID}, got ${pullItem?.iteration?.iterationId || 'none'}.`);
            }
            if (primaryIssueItem?.iteration?.iterationId !== process.env.PRIMARY_ITERATION_ID) {
              throw new Error('The older linked issue Sprint was unexpectedly changed.');
            }
            if (secondaryIssueItem?.iteration?.iterationId !== process.env.LATEST_ITERATION_ID) {
              throw new Error('The later linked issue Sprint was unexpectedly changed.');
            }
            if (unsprintedIssueItem?.iteration?.iterationId !== process.env.LATEST_ITERATION_ID) {
              throw new Error('The open linked issue without a Sprint did not inherit the selected Sprint.');
            }
            const pull = await github.request('GET /repos/{owner}/{repo}/pulls/{pull_number}', {
              owner: process.env.PULL_REQUEST_REPO_OWNER,
              repo: process.env.PULL_REQUEST_REPO_NAME,
              pull_number: Number(process.env.PULL_NUMBER),
            });
            const occurrences = (pull.data.body || '').split(process.env.CLOSES_REF).length - 1;
            if (occurrences !== 1) throw new Error(`Expected one closing reference, got ${occurrences}.`);
            core.info(`PR selected latest linked Sprint ${process.env.LATEST_ITERATION_ID}; existing issue Sprints stayed unchanged and the unsprinted issue inherited it.`);

      - name: Change linked issue Sprint without touching the PR
        uses: actions/github-script@v8
        env:
          PROJECT_ID: ${{ needs.prepare-link-scenario.outputs.project_id }}
          ITERATION_FIELD_ID: ${{ needs.prepare-link-scenario.outputs.iteration_field_id }}
          STATUS_FIELD_ID: ${{ needs.prepare-link-scenario.outputs.status_field_id }}
          STATUS_IN_REVIEW_VALUE: ${{ needs.prepare-link-scenario.outputs.status_in_review_value }}
          PULL_NODE_ID: ${{ needs.prepare-link-scenario.outputs.pull_node_id }}
          SECONDARY_ISSUE_NODE_ID: ${{ needs.prepare-link-edited-scenario.outputs.secondary_issue_node_id }}
          UNSPRINTED_ISSUE_NODE_ID: ${{ needs.prepare-link-edited-scenario.outputs.unsprinted_issue_node_id }}
        with:
          github-token: ${{ steps.auth.outputs.token }}
          script: |
            const projectId = process.env.PROJECT_ID;
            const data = await github.graphql(`
              query($pullNodeId: ID!, $secondaryNodeId: ID!, $unsprintedNodeId: ID!, $statusFieldId: ID!) {
                pull: node(id: $pullNodeId) {
                  ... on PullRequest { projectItems(first: 100) { nodes { id project { id } } } }
                }
                secondary: node(id: $secondaryNodeId) {
                  ... on Issue { projectItems(first: 100) { nodes { id project { id } } } }
                }
                unsprinted: node(id: $unsprintedNodeId) {
                  ... on Issue { projectItems(first: 100) { nodes { id project { id } } } }
                }
                statusField: node(id: $statusFieldId) {
                  ... on ProjectV2SingleSelectField { options { id name } }
                }
              }
            `, {
              pullNodeId: process.env.PULL_NODE_ID,
              secondaryNodeId: process.env.SECONDARY_ISSUE_NODE_ID,
              unsprintedNodeId: process.env.UNSPRINTED_ISSUE_NODE_ID,
              statusFieldId: process.env.STATUS_FIELD_ID,
            });
            const item = (node) => node?.projectItems?.nodes?.find((candidate) => candidate.project?.id === projectId);
            const pullItem = item(data.pull);
            const secondaryItem = item(data.secondary);
            const unsprintedItem = item(data.unsprinted);
            const reviewOption = data.statusField?.options?.find((option) => option.name === process.env.STATUS_IN_REVIEW_VALUE);
            if (!pullItem || !secondaryItem || !unsprintedItem || !reviewOption) {
              throw new Error('Sprint reconciliation test fixture is incomplete.');
            }
            const clearSprint = (itemId) => github.graphql(`
              mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!) {
                clearProjectV2ItemFieldValue(input: { projectId: $projectId, itemId: $itemId, fieldId: $fieldId }) {
                  projectV2Item { id }
                }
              }
            `, { projectId, itemId, fieldId: process.env.ITERATION_FIELD_ID });
            await clearSprint(secondaryItem.id);
            await clearSprint(unsprintedItem.id);
            await github.graphql(`
              mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
                updateProjectV2ItemFieldValue(input: {
                  projectId: $projectId, itemId: $itemId, fieldId: $fieldId,
                  value: { singleSelectOptionId: $optionId }
                }) { projectV2Item { id } }
              }
            `, {
              projectId, itemId: pullItem.id, fieldId: process.env.STATUS_FIELD_ID, optionId: reviewOption.id,
            });

  run-reconcile-sprint-scenario:
    name: Reconcile changed linked issue Sprint
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    needs:
      - prepare-link-scenario
      - assert-link-edited-scenario
    uses: ./.github/workflows/link-pr-to-project.yml
    with:
      project_owner: ${{ github.event_name == 'workflow_dispatch' && inputs.auth_mode == 'app' && 'ViRGiL-GH-Productivity' || 'ViRGiL175' }}
      project_number: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.auth_mode == 'app' && '1' || '10') }}
      backlog_repo: ${{ needs.prepare-link-scenario.outputs.backlog_repo_name }}
      backlog_repo_owner: ${{ needs.prepare-link-scenario.outputs.backlog_repo_owner }}
      iteration_field_name: Iteration
      status_field_name: Status
      status_done_value: Done
      action: reconcile_sprints
      repositories: ${{ needs.prepare-link-scenario.outputs.pull_request_repo_owner }}/${{ needs.prepare-link-scenario.outputs.pull_request_repo_name }}
      reconcile_pull_request_number: ${{ fromJSON(needs.prepare-link-scenario.outputs.pull_number) }}
      auth_mode: ${{ github.event_name == 'workflow_dispatch' && inputs.auth_mode || 'pat' }}
      installation_owner: ${{ github.event_name == 'workflow_dispatch' && inputs.auth_mode == 'app' && 'ViRGiL-GH-Productivity' || 'ViRGiL175' }}
    secrets:
      pat_token: ${{ secrets.ORG_PROJECT_TOKEN }}
      app_id: ${{ secrets.ORG_AUTOMATION_APP_ID }}
      app_private_key: ${{ secrets.ORG_AUTOMATION_APP_PRIVATE_KEY }}

  assert-reconcile-sprint-scenario:
    name: Assert PR Sprint changed without changing Status
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    needs:
      - prepare-link-scenario
      - prepare-link-edited-scenario
      - run-reconcile-sprint-scenario
    runs-on: ubuntu-latest
    steps:
      - name: Normalize GitHub App private key
        if: ${{ env.AUTH_MODE == 'app' }}
        id: normalize-key
        shell: bash
        env:
          RAW_PRIVATE_KEY: ${{ secrets.ORG_AUTOMATION_APP_PRIVATE_KEY }}
        run: |
          NORMALIZED_KEY=$(printf '%b' "$RAW_PRIVATE_KEY")
          while IFS= read -r line; do
            printf '::add-mask::%s\n' "$line"
          done <<< "$NORMALIZED_KEY"
          printf 'private_key<<EOF\n%s\nEOF\n' "$NORMALIZED_KEY" >> "$GITHUB_OUTPUT"

      - name: Create GitHub App installation token
        if: ${{ env.AUTH_MODE == 'app' }}
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.ORG_AUTOMATION_APP_ID }}
          private-key: ${{ steps.normalize-key.outputs.private_key }}
          owner: ${{ env.INSTALLATION_OWNER }}
          skip-token-revoke: true

      - name: Assert reconciled Sprint and preserved PR Status
        uses: actions/github-script@v8
        env:
          PROJECT_ID: ${{ needs.prepare-link-scenario.outputs.project_id }}
          ITERATION_FIELD_NAME: ${{ env.ITERATION_FIELD_NAME }}
          STATUS_FIELD_NAME: ${{ env.STATUS_FIELD_NAME }}
          TARGET_ITERATION_ID: ${{ needs.prepare-link-scenario.outputs.target_iteration_id }}
          STATUS_IN_REVIEW_VALUE: ${{ needs.prepare-link-scenario.outputs.status_in_review_value }}
          PULL_NODE_ID: ${{ needs.prepare-link-scenario.outputs.pull_node_id }}
          SECONDARY_ISSUE_NODE_ID: ${{ needs.prepare-link-edited-scenario.outputs.secondary_issue_node_id }}
          UNSPRINTED_ISSUE_NODE_ID: ${{ needs.prepare-link-edited-scenario.outputs.unsprinted_issue_node_id }}
        with:
          github-token: ${{ env.AUTH_MODE == 'app' && steps.app-token.outputs.token || secrets.ORG_PROJECT_TOKEN }}
          script: |
            const data = await github.graphql(`
              query($pullId: ID!, $secondaryId: ID!, $unsprintedId: ID!, $sprintName: String!, $statusName: String!) {
                pull: node(id: $pullId) {
                  ... on PullRequest { projectItems(first: 100) { nodes {
                    project { id }
                    sprint: fieldValueByName(name: $sprintName) { ... on ProjectV2ItemFieldIterationValue { iterationId } }
                    status: fieldValueByName(name: $statusName) { ... on ProjectV2ItemFieldSingleSelectValue { name } }
                  } } }
                }
                secondary: node(id: $secondaryId) {
                  ... on Issue { projectItems(first: 100) { nodes {
                    project { id }
                    sprint: fieldValueByName(name: $sprintName) { ... on ProjectV2ItemFieldIterationValue { iterationId } }
                  } } }
                }
                unsprinted: node(id: $unsprintedId) {
                  ... on Issue { projectItems(first: 100) { nodes {
                    project { id }
                    sprint: fieldValueByName(name: $sprintName) { ... on ProjectV2ItemFieldIterationValue { iterationId } }
                  } } }
                }
              }
            `, {
              pullId: process.env.PULL_NODE_ID,
              secondaryId: process.env.SECONDARY_ISSUE_NODE_ID,
              unsprintedId: process.env.UNSPRINTED_ISSUE_NODE_ID,
              sprintName: process.env.ITERATION_FIELD_NAME,
              statusName: process.env.STATUS_FIELD_NAME,
            });
            const item = (node) => node?.projectItems?.nodes?.find((candidate) => candidate.project?.id === process.env.PROJECT_ID);
            const expectedSprint = process.env.TARGET_ITERATION_ID;
            for (const node of [data.pull, data.secondary, data.unsprinted]) {
              const actual = item(node)?.sprint?.iterationId;
              if (actual !== expectedSprint) throw new Error(`Expected reconciled Sprint ${expectedSprint}, got ${actual || 'none'}.`);
            }
            const actualStatus = item(data.pull)?.status?.name;
            if (actualStatus !== process.env.STATUS_IN_REVIEW_VALUE) {
              throw new Error(`PR Status changed during Sprint reconciliation: ${actualStatus || 'none'}.`);
            }

      - name: Reset PR and closing issues to Todo before synchronize
        uses: actions/github-script@v8
        env:
          PROJECT_ID: ${{ needs.prepare-link-scenario.outputs.project_id }}
          STATUS_FIELD_ID: ${{ needs.prepare-link-scenario.outputs.status_field_id }}
          PULL_NODE_ID: ${{ needs.prepare-link-scenario.outputs.pull_node_id }}
          PRIMARY_ISSUE_NODE_ID: ${{ needs.prepare-link-scenario.outputs.issue_node_id }}
          SECONDARY_ISSUE_NODE_ID: ${{ needs.prepare-link-edited-scenario.outputs.secondary_issue_node_id }}
          UNSPRINTED_ISSUE_NODE_ID: ${{ needs.prepare-link-edited-scenario.outputs.unsprinted_issue_node_id }}
        with:
          github-token: ${{ env.AUTH_MODE == 'app' && steps.app-token.outputs.token || secrets.ORG_PROJECT_TOKEN }}
          script: |
            const projectId = process.env.PROJECT_ID;
            const data = await github.graphql(`
              query($pullId: ID!, $primaryId: ID!, $secondaryId: ID!, $unsprintedId: ID!, $statusFieldId: ID!) {
                pull: node(id: $pullId) { ... on PullRequest { projectItems(first: 100) { nodes { id project { id } } } } }
                primary: node(id: $primaryId) { ... on Issue { projectItems(first: 100) { nodes { id project { id } } } } }
                secondary: node(id: $secondaryId) { ... on Issue { projectItems(first: 100) { nodes { id project { id } } } } }
                unsprinted: node(id: $unsprintedId) { ... on Issue { projectItems(first: 100) { nodes { id project { id } } } } }
                statusField: node(id: $statusFieldId) { ... on ProjectV2SingleSelectField { options { id name } } }
              }
            `, {
              pullId: process.env.PULL_NODE_ID,
              primaryId: process.env.PRIMARY_ISSUE_NODE_ID,
              secondaryId: process.env.SECONDARY_ISSUE_NODE_ID,
              unsprintedId: process.env.UNSPRINTED_ISSUE_NODE_ID,
              statusFieldId: process.env.STATUS_FIELD_ID,
            });
            const todo = data.statusField?.options?.find((option) =>
              option.name.toLowerCase().replace(/[\s_-]+/g, '') === 'todo');
            if (!todo) throw new Error('Todo option is missing from the sandbox project.');
            const projectItem = (node) => node?.projectItems?.nodes?.find((candidate) => candidate.project?.id === projectId);
            for (const node of [data.pull, data.primary, data.secondary, data.unsprinted]) {
              const item = projectItem(node);
              if (!item) throw new Error('A synchronize fixture is missing from the sandbox project.');
              await github.graphql(`
                mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
                  updateProjectV2ItemFieldValue(input: {
                    projectId: $projectId, itemId: $itemId, fieldId: $fieldId,
                    value: { singleSelectOptionId: $optionId }
                  }) { projectV2Item { id } }
                }
              `, { projectId, itemId: item.id, fieldId: process.env.STATUS_FIELD_ID, optionId: todo.id });
            }

  run-link-synchronize-scenario:
    name: Run new commit status scenario
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    needs:
      - resolve-auth
      - prepare-link-scenario
      - assert-reconcile-sprint-scenario
    uses: ./.github/workflows/link-pr-to-project.yml
    with:
      project_owner: ${{ github.event_name == 'workflow_dispatch' && inputs.auth_mode == 'app' && 'ViRGiL-GH-Productivity' || 'ViRGiL175' }}
      project_number: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.auth_mode == 'app' && '1' || '10') }}
      backlog_repo: ${{ needs.prepare-link-scenario.outputs.backlog_repo_name }}
      backlog_repo_owner: ${{ needs.prepare-link-scenario.outputs.backlog_repo_owner }}
      iteration_field_name: Iteration
      status_field_name: Status
      status_done_value: Done
      status_in_progress_value: ${{ needs.prepare-link-scenario.outputs.status_in_progress_value }}
      status_in_review_value: ${{ needs.prepare-link-scenario.outputs.status_in_review_value }}
      pull_request_node_id: ${{ needs.prepare-link-scenario.outputs.pull_node_id }}
      pull_request_number: ${{ needs.prepare-link-scenario.outputs.pull_number }}
      pull_request_repo_owner: ${{ needs.prepare-link-scenario.outputs.pull_request_repo_owner }}
      pull_request_repo_name: ${{ needs.prepare-link-scenario.outputs.pull_request_repo_name }}
      head_ref: itest-manual-link-${{ github.run_id }}
      action: synchronize
      auth_mode: ${{ github.event_name == 'workflow_dispatch' && inputs.auth_mode || 'pat' }}
      installation_owner: ${{ github.event_name == 'workflow_dispatch' && inputs.auth_mode == 'app' && 'ViRGiL-GH-Productivity' || 'ViRGiL175' }}
    secrets:
      pat_token: ${{ secrets.ORG_PROJECT_TOKEN }}
      app_id: ${{ secrets.ORG_AUTOMATION_APP_ID }}
      app_private_key: ${{ secrets.ORG_AUTOMATION_APP_PRIVATE_KEY }}

  assert-link-synchronize-scenario:
    name: Assert PR and closing issues are in progress
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    needs:
      - prepare-link-scenario
      - prepare-link-edited-scenario
      - run-link-synchronize-scenario
    runs-on: ubuntu-latest
    steps:
      - name: Normalize GitHub App private key
        if: ${{ env.AUTH_MODE == 'app' }}
        id: normalize-key
        shell: bash
        env:
          RAW_PRIVATE_KEY: ${{ secrets.ORG_AUTOMATION_APP_PRIVATE_KEY }}
        run: |
          NORMALIZED_KEY=$(printf '%b' "$RAW_PRIVATE_KEY")
          while IFS= read -r line; do
            printf '::add-mask::%s\n' "$line"
          done <<< "$NORMALIZED_KEY"
          printf 'private_key<<EOF\n%s\nEOF\n' "$NORMALIZED_KEY" >> "$GITHUB_OUTPUT"

      - name: Create GitHub App installation token
        if: ${{ env.AUTH_MODE == 'app' }}
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.ORG_AUTOMATION_APP_ID }}
          private-key: ${{ steps.normalize-key.outputs.private_key }}
          owner: ${{ env.INSTALLATION_OWNER }}
          skip-token-revoke: true

      - name: Assert all statuses after synchronize
        uses: actions/github-script@v8
        env:
          PROJECT_ID: ${{ needs.prepare-link-scenario.outputs.project_id }}
          STATUS_FIELD_NAME: ${{ env.STATUS_FIELD_NAME }}
          STATUS_IN_PROGRESS_VALUE: ${{ needs.prepare-link-scenario.outputs.status_in_progress_value }}
          PULL_NODE_ID: ${{ needs.prepare-link-scenario.outputs.pull_node_id }}
          PRIMARY_ISSUE_NODE_ID: ${{ needs.prepare-link-scenario.outputs.issue_node_id }}
          SECONDARY_ISSUE_NODE_ID: ${{ needs.prepare-link-edited-scenario.outputs.secondary_issue_node_id }}
          UNSPRINTED_ISSUE_NODE_ID: ${{ needs.prepare-link-edited-scenario.outputs.unsprinted_issue_node_id }}
        with:
          github-token: ${{ env.AUTH_MODE == 'app' && steps.app-token.outputs.token || secrets.ORG_PROJECT_TOKEN }}
          script: |
            const data = await github.graphql(`
              query($pullId: ID!, $primaryId: ID!, $secondaryId: ID!, $unsprintedId: ID!, $statusName: String!) {
                pull: node(id: $pullId) { ... on PullRequest { projectItems(first: 100) { nodes {
                  project { id }
                  status: fieldValueByName(name: $statusName) { ... on ProjectV2ItemFieldSingleSelectValue { name } }
                } } } }
                primary: node(id: $primaryId) { ... on Issue { projectItems(first: 100) { nodes {
                  project { id }
                  status: fieldValueByName(name: $statusName) { ... on ProjectV2ItemFieldSingleSelectValue { name } }
                } } } }
                secondary: node(id: $secondaryId) { ... on Issue { projectItems(first: 100) { nodes {
                  project { id }
                  status: fieldValueByName(name: $statusName) { ... on ProjectV2ItemFieldSingleSelectValue { name } }
                } } } }
                unsprinted: node(id: $unsprintedId) { ... on Issue { projectItems(first: 100) { nodes {
                  project { id }
                  status: fieldValueByName(name: $statusName) { ... on ProjectV2ItemFieldSingleSelectValue { name } }
                } } } }
              }
            `, {
              pullId: process.env.PULL_NODE_ID,
              primaryId: process.env.PRIMARY_ISSUE_NODE_ID,
              secondaryId: process.env.SECONDARY_ISSUE_NODE_ID,
              unsprintedId: process.env.UNSPRINTED_ISSUE_NODE_ID,
              statusName: process.env.STATUS_FIELD_NAME,
            });
            for (const [label, node] of Object.entries(data)) {
              const item = node?.projectItems?.nodes?.find((candidate) => candidate.project?.id === process.env.PROJECT_ID);
              if (item?.status?.name !== process.env.STATUS_IN_PROGRESS_VALUE) {
                throw new Error(`${label} expected ${process.env.STATUS_IN_PROGRESS_VALUE}, got ${item?.status?.name || 'none'}.`);
