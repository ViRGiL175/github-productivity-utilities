# Integration test: создаёт issue и PR, проверяет привязку PR к Project V2,
# перенос sprint и assignee из issue, позднюю closing reference, перевод в Need Review
# при запросе human-reviewer и установку статуса Done при закрытии, плюс cleanup.
# В обоих auth-режимах issue живёт в backlog-репозитории, а PR — в отдельном client-репозитории с nondefault base.
name: Test link-pr-to-project

on:
  workflow_dispatch:
    inputs:
      auth_mode:
        description: Token source to use for integration tests (pat=CI_SANDBOX_TOKEN, app=GitHub App; both use org sandbox)
        required: false
        default: pat
        type: choice
        options:
          - pat
          - app
  pull_request:
    paths:
      - 'scripts/prepare-field-parser.mjs'
      - '.github/workflows/resolve-integration-test-token.yml'
      - 'package*.json'
      - '.github/workflows/link-pr-to-project.yml'
      - '.github/workflows/test-link-pr-to-project.yml'
      - '.github/workflows/sandbox-auth-modes.yml'
      - '.github/workflows/itest-link-pr-to-project.yml'
      - 'src/automations/link-pr-to-project/**'
      - 'src/automations/field-updates/**'
      - 'src/automations/ensure-next-iteration-reminder/**'
      - 'src/automations/safe-dependabot-pr-link/**'
      - 'src/github/ClosingReferenceParser.ts'
      - 'src/github/FieldController.ts'
      - 'src/github/IssueRepository.ts'
      - 'src/github/ProjectV2Repository.ts'
      - 'src/github/PullRequestRepository.ts'
      - 'src/scripts/link-pr-to-project.ts'
      - 'src/scripts/reconcile-open-pr-sprints.ts'
      - 'src/scripts/environment.ts'
      - 'src/runtime/**'
      - 'itest/retry-assertion.ts'
      - 'itest/runtime.ts'

concurrency:
  group: integration-org-sandbox
  queue: max
  cancel-in-progress: false

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  auth-modes:
    uses: ./.github/workflows/sandbox-auth-modes.yml
    with:
      requested_mode: ${{ inputs.auth_mode || '' }}

  sandbox:
    name: Sandbox (${{ matrix.auth_mode }})
    needs: auth-modes
    if: needs.auth-modes.outputs.modes != ''
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        auth_mode: ${{ fromJSON(needs.auth-modes.outputs.modes) }}
    uses: ./.github/workflows/itest-link-pr-to-project.yml
    with:
      auth_mode: ${{ matrix.auth_mode }}
    secrets:
      pat_token: ${{ matrix.auth_mode == 'pat' && secrets.CI_SANDBOX_TOKEN || '' }}
      app_id: ${{ matrix.auth_mode == 'app' && secrets.ORG_AUTOMATION_APP_ID || '' }}
      app_private_key: ${{ matrix.auth_mode == 'app' && secrets.ORG_AUTOMATION_APP_PRIVATE_KEY || '' }}
