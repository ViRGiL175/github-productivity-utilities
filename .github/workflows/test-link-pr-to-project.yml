      project_number: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.auth_mode == 'app' && '1' || '10') }}
      backlog_repo: ${{ needs.prepare-link-scenario.outputs.backlog_repo_name }}
      backlog_repo_owner: ${{ needs.prepare-link-scenario.outputs.backlog_repo_owner }}
      iteration_field_name: Iteration
      status_field_name: Status
      status_done_value: Done
      status_in_progress_value: ${{ needs.prepare-link-scenario.outputs.status_in_progress_value }}
      status_in_review_value: ${{ needs.prepare-link-scenario.outputs.status_in_review_value }}
      pull_request_node_id: ${{ needs.prepare-link-scenario.outputs.pull_node_id }}
