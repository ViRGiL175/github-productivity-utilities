# Integration test: проверяет создание reminder draft до старта итерации,
# сохранение draft в пустой текущей итерации, идемпотентность повторного запуска и cleanup.
name: Test ensure-next-iteration-reminder

on:
  workflow_dispatch:
    inputs:
      auth_mode:
        description: Token source to use for integration tests (pat=CI_SANDBOX_TOKEN, app=GitHub App; both use org sandbox)
        required: false
        default: pat
        type: choice
        options:
          - pat
          - app
  pull_request:
    paths:
      - '.github/workflows/resolve-integration-test-token.yml'
      - 'package*.json'
      - '.github/workflows/ensure-next-iteration-reminder.yml'
      - '.github/workflows/test-ensure-next-iteration-reminder.yml'
      - 'src/automations/ensure-next-iteration-reminder/**'
      - 'src/github/ProjectV2Repository.ts'
      - 'itest/create-next-iteration.ts'
      - 'itest/runtime.ts'
      - 'itest/reminder-fixtures.ts'

concurrency:
  group: integration-org-sandbox
  queue: max
  cancel-in-progress: false

permissions:
  contents: read
  issues: read
  pull-requests: read

env:
  AUTH_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.auth_mode || 'pat' }}
  INSTALLATION_OWNER: ViRGiL-GH-Productivity
  PROJECT_OWNER: ViRGiL-GH-Productivity
  PROJECT_NUMBER: 1
  ITERATION_FIELD_NAME: Iteration

jobs:
  resolve-auth:
    name: Validate integration auth configuration
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    uses: ./.github/workflows/resolve-integration-test-token.yml
    with:
      auth_mode: ${{ github.event_name == 'workflow_dispatch' && inputs.auth_mode || 'pat' }}
      installation_owner: ViRGiL-GH-Productivity
    secrets:
      pat_token: ${{ secrets.CI_SANDBOX_TOKEN }}
      app_id: ${{ github.event_name == 'workflow_dispatch' && inputs.auth_mode == 'app' && secrets.ORG_AUTOMATION_APP_ID || '' }}
      app_private_key: ${{ github.event_name == 'workflow_dispatch' && inputs.auth_mode == 'app' && secrets.ORG_AUTOMATION_APP_PRIVATE_KEY || '' }}

  create-next-iteration-scenario:
    name: Create next iteration and preserve history
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    needs: resolve-auth
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tested implementation
        uses: actions/checkout@v7

      - &app-token-step
        name: Create GitHub App installation token
        if: ${{ env.AUTH_MODE == 'app' }}
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ github.event_name == 'workflow_dispatch' && inputs.auth_mode == 'app' && secrets.ORG_AUTOMATION_APP_ID || '' }}
          private-key: ${{ github.event_name == 'workflow_dispatch' && inputs.auth_mode == 'app' && secrets.ORG_AUTOMATION_APP_PRIVATE_KEY || '' }}
          owner: ${{ env.INSTALLATION_OWNER }}
          skip-token-revoke: true

      - &resolve-token-step
        name: Resolve job auth token
        id: auth
        shell: bash
        env:
          DIRECT_TOKEN: ${{ secrets.CI_SANDBOX_TOKEN }}
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          case "$AUTH_MODE" in
            pat)
              TOKEN="$DIRECT_TOKEN"
              ;;
            app)
              TOKEN="$APP_TOKEN"
              ;;
            *)
              echo "Unsupported auth mode: $AUTH_MODE" >&2
              exit 1
              ;;
          esac

          if [ -z "$TOKEN" ]; then
            echo "Resolved token is empty for auth_mode=$AUTH_MODE" >&2
            exit 1
          fi

          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Create next iteration, repeat and verify preserved bindings
        uses: actions/github-script@v9
        with:
          github-token: ${{ steps.auth.outputs.token }}
          script: |
            const { run } = await import(`${process.env.GITHUB_WORKSPACE}/itest/create-next-iteration.ts`)
            await run(github, core)

  prepare-reminder-create-scenario:
    name: Prepare reminder create scenario before current iteration starts
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    needs: [resolve-auth, create-next-iteration-scenario]
    outputs:
      reminder_title: ${{ steps.prepare.outputs.reminder_title }}
      current_date_override: ${{ steps.prepare.outputs.current_date_override }}
      target_iteration_id: ${{ steps.prepare.outputs.target_iteration_id }}
      project_id: ${{ steps.prepare.outputs.project_id }}
    steps:
      - uses: actions/checkout@v7
      - *app-token-step

      - *resolve-token-step

      - name: Prepare reminder fixtures for create scenario
        id: prepare
        uses: actions/github-script@v9
        env:
          PROJECT_OWNER: ${{ env.PROJECT_OWNER }}
          PROJECT_NUMBER: ${{ env.PROJECT_NUMBER }}
          ITERATION_FIELD_NAME: ${{ env.ITERATION_FIELD_NAME }}
          REMINDER_TITLE: ITEST-${{ github.run_id }}-create-reminder
        with:
          github-token: ${{ steps.auth.outputs.token }}
          script: |
            const { prepareReminder } = await import(`${process.env.GITHUB_WORKSPACE}/itest/reminder-fixtures.ts`);
            await prepareReminder(github, core, 'before-first');

  run-reminder-create-scenario:
    name: Run reminder create scenario
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    needs:
      - resolve-auth
      - prepare-reminder-create-scenario
    uses: ./.github/workflows/ensure-next-iteration-reminder.yml
    with:
      project_owner: ViRGiL-GH-Productivity
      project_number: 1
      iteration_field_name: Iteration
      reminder_title: ${{ needs.prepare-reminder-create-scenario.outputs.reminder_title }}
      current_date_override: ${{ needs.prepare-reminder-create-scenario.outputs.current_date_override }}
      auth_mode: ${{ github.event_name == 'workflow_dispatch' && inputs.auth_mode || 'pat' }}
      installation_owner: ViRGiL-GH-Productivity
    secrets:
      pat_token: ${{ secrets.CI_SANDBOX_TOKEN }}
      app_id: ${{ github.event_name == 'workflow_dispatch' && inputs.auth_mode == 'app' && secrets.ORG_AUTOMATION_APP_ID || '' }}
      app_private_key: ${{ github.event_name == 'workflow_dispatch' && inputs.auth_mode == 'app' && secrets.ORG_AUTOMATION_APP_PRIVATE_KEY || '' }}

  assert-reminder-create-scenario:
    name: Assert reminder create scenario
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    needs:
      - resolve-auth
      - prepare-reminder-create-scenario
      - run-reminder-create-scenario
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - *app-token-step

      - *resolve-token-step

      - name: Assert exactly one reminder draft exists in first future iteration
        uses: actions/github-script@v9
        env:
          PROJECT_ID: ${{ needs.prepare-reminder-create-scenario.outputs.project_id }}
          REMINDER_TITLE: ${{ needs.prepare-reminder-create-scenario.outputs.reminder_title }}
          TARGET_ITERATION_ID: ${{ needs.prepare-reminder-create-scenario.outputs.target_iteration_id }}
        with:
          github-token: ${{ steps.auth.outputs.token }}
          script: |
            const { assertReminder } = await import(`${process.env.GITHUB_WORKSPACE}/itest/reminder-fixtures.ts`);
            await assertReminder(github, 12);

  rerun-reminder-create-scenario:
    name: Rerun reminder create scenario for idempotency
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    needs:
      - resolve-auth
      - prepare-reminder-create-scenario
      - assert-reminder-create-scenario
    uses: ./.github/workflows/ensure-next-iteration-reminder.yml
    with:
      project_owner: ViRGiL-GH-Productivity
      project_number: 1
      iteration_field_name: Iteration
      reminder_title: ${{ needs.prepare-reminder-create-scenario.outputs.reminder_title }}
      current_date_override: ${{ needs.prepare-reminder-create-scenario.outputs.current_date_override }}
      auth_mode: ${{ github.event_name == 'workflow_dispatch' && inputs.auth_mode || 'pat' }}
      installation_owner: ViRGiL-GH-Productivity
    secrets:
      pat_token: ${{ secrets.CI_SANDBOX_TOKEN }}
      app_id: ${{ github.event_name == 'workflow_dispatch' && inputs.auth_mode == 'app' && secrets.ORG_AUTOMATION_APP_ID || '' }}
      app_private_key: ${{ github.event_name == 'workflow_dispatch' && inputs.auth_mode == 'app' && secrets.ORG_AUTOMATION_APP_PRIVATE_KEY || '' }}

  assert-reminder-idempotency-scenario:
    name: Assert reminder idempotency scenario
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    needs:
      - resolve-auth
      - prepare-reminder-create-scenario
      - rerun-reminder-create-scenario
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - *app-token-step

      - *resolve-token-step

      - name: Assert rerun did not create duplicates before current iteration starts
        uses: actions/github-script@v9
        env:
          PROJECT_ID: ${{ needs.prepare-reminder-create-scenario.outputs.project_id }}
          REMINDER_TITLE: ${{ needs.prepare-reminder-create-scenario.outputs.reminder_title }}
          TARGET_ITERATION_ID: ${{ needs.prepare-reminder-create-scenario.outputs.target_iteration_id }}
        with:
          github-token: ${{ steps.auth.outputs.token }}
          script: |
            const { assertReminder } = await import(`${process.env.GITHUB_WORKSPACE}/itest/reminder-fixtures.ts`);
            await assertReminder(github);

  prepare-reminder-empty-current-scenario:
    name: Prepare reminder empty current scenario
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    needs: [resolve-auth, cleanup-reminder-scenarios]
    outputs:
      reminder_title: ${{ steps.prepare.outputs.reminder_title }}
      current_date_override: ${{ steps.prepare.outputs.current_date_override }}
      target_iteration_id: ${{ steps.prepare.outputs.target_iteration_id }}
      project_id: ${{ steps.prepare.outputs.project_id }}
    steps:
      - uses: actions/checkout@v7
      - *app-token-step

      - *resolve-token-step

      - name: Prepare reminder fixture in empty current iteration
        id: prepare
        uses: actions/github-script@v9
        env:
          PROJECT_OWNER: ${{ env.PROJECT_OWNER }}
          PROJECT_NUMBER: ${{ env.PROJECT_NUMBER }}
          ITERATION_FIELD_NAME: ${{ env.ITERATION_FIELD_NAME }}
          REMINDER_TITLE: ITEST-${{ github.run_id }}-empty-current-reminder
        with:
          github-token: ${{ steps.auth.outputs.token }}
          script: |
            const { prepareReminder } = await import(`${process.env.GITHUB_WORKSPACE}/itest/reminder-fixtures.ts`);
            await prepareReminder(github, core, 'empty-current');

  run-reminder-empty-current-scenario:
    name: Run reminder empty current scenario
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    needs:
      - resolve-auth
      - prepare-reminder-empty-current-scenario
    uses: ./.github/workflows/ensure-next-iteration-reminder.yml
    with:
      project_owner: ViRGiL-GH-Productivity
      project_number: 1
      iteration_field_name: Iteration
      reminder_title: ${{ needs.prepare-reminder-empty-current-scenario.outputs.reminder_title }}
      current_date_override: ${{ needs.prepare-reminder-empty-current-scenario.outputs.current_date_override }}
      auth_mode: ${{ github.event_name == 'workflow_dispatch' && inputs.auth_mode || 'pat' }}
      installation_owner: ViRGiL-GH-Productivity
    secrets:
      pat_token: ${{ secrets.CI_SANDBOX_TOKEN }}
      app_id: ${{ github.event_name == 'workflow_dispatch' && inputs.auth_mode == 'app' && secrets.ORG_AUTOMATION_APP_ID || '' }}
      app_private_key: ${{ github.event_name == 'workflow_dispatch' && inputs.auth_mode == 'app' && secrets.ORG_AUTOMATION_APP_PRIVATE_KEY || '' }}

  assert-reminder-empty-current-scenario:
    name: Assert reminder empty current scenario
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    needs:
      - resolve-auth
      - prepare-reminder-empty-current-scenario
      - run-reminder-empty-current-scenario
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - *app-token-step

      - *resolve-token-step

      - name: Assert reminder stayed in empty current iteration
        uses: actions/github-script@v9
        env:
          PROJECT_ID: ${{ needs.prepare-reminder-empty-current-scenario.outputs.project_id }}
          REMINDER_TITLE: ${{ needs.prepare-reminder-empty-current-scenario.outputs.reminder_title }}
          TARGET_ITERATION_ID: ${{ needs.prepare-reminder-empty-current-scenario.outputs.target_iteration_id }}
        with:
          github-token: ${{ steps.auth.outputs.token }}
          script: |
            const { assertReminder } = await import(`${process.env.GITHUB_WORKSPACE}/itest/reminder-fixtures.ts`);
            await assertReminder(github);

  cleanup-reminder-scenarios:
    name: Cleanup reminder scenarios
    if: ${{ always() && needs.prepare-reminder-create-scenario.outputs.project_id != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    needs:
      - resolve-auth
      - prepare-reminder-create-scenario
      - run-reminder-create-scenario
      - assert-reminder-create-scenario
      - rerun-reminder-create-scenario
      - assert-reminder-idempotency-scenario
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - *app-token-step

      - *resolve-token-step

      - name: Delete reminder drafts created by this run
        uses: actions/github-script@v9
        env:
          PROJECT_ID: ${{ needs.prepare-reminder-create-scenario.outputs.project_id }}
          REMINDER_TITLE: ${{ needs.prepare-reminder-create-scenario.outputs.reminder_title }}
        with:
          github-token: ${{ steps.auth.outputs.token }}
          script: |
            const { cleanReminders } = await import(`${process.env.GITHUB_WORKSPACE}/itest/reminder-fixtures.ts`);
            await cleanReminders(github);

  cleanup-reminder-empty-current-scenario:
    name: Cleanup reminder empty current scenario
    if: ${{ always() && needs.prepare-reminder-empty-current-scenario.outputs.project_id != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    needs:
      - resolve-auth
      - prepare-reminder-empty-current-scenario
      - run-reminder-empty-current-scenario
      - assert-reminder-empty-current-scenario
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - *app-token-step

      - *resolve-token-step

      - name: Delete reminder draft created for empty current scenario
        uses: actions/github-script@v9
        env:
          PROJECT_ID: ${{ needs.prepare-reminder-empty-current-scenario.outputs.project_id }}
          REMINDER_TITLE: ${{ needs.prepare-reminder-empty-current-scenario.outputs.reminder_title }}
        with:
          github-token: ${{ steps.auth.outputs.token }}
          script: |
            const { cleanReminders } = await import(`${process.env.GITHUB_WORKSPACE}/itest/reminder-fixtures.ts`);
            await cleanReminders(github);

  test-skipped-for-fork-pr:
    name: Test skipped for fork PR
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
    runs-on: ubuntu-latest
    steps:
      - name: Explain why test is skipped
        run: echo "Skipping integration test for fork pull requests because repository secrets are unavailable."
