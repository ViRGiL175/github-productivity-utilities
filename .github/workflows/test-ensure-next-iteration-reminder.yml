# Integration test: проверяет создание reminder draft до старта итерации,
# сохранение draft в пустой текущей итерации, идемпотентность повторного запуска и cleanup.
name: Test ensure-next-iteration-reminder

on:
  workflow_dispatch:
    inputs:
      auth_mode:
        description: Token source to use for integration tests (pat=CI_SANDBOX_TOKEN, app=GitHub App; both use org sandbox)
        required: false
        default: pat
        type: choice
        options:
          - pat
          - app
  pull_request:
    paths:
      - '.github/workflows/resolve-integration-test-token.yml'
      - 'package*.json'
      - '.github/workflows/ensure-next-iteration-reminder.yml'
      - '.github/workflows/test-ensure-next-iteration-reminder.yml'
      - '.github/workflows/sandbox-auth-modes.yml'
      - '.github/workflows/itest-ensure-next-iteration-reminder.yml'
      - 'src/automations/ensure-next-iteration-reminder/**'
      - 'src/scripts/ensure-next-iteration-reminder.ts'
      - 'src/scripts/environment.ts'
      - 'src/runtime/**'
      - 'src/github/ProjectV2Repository.ts'
      - 'itest/create-next-iteration.ts'
      - 'itest/runtime.ts'
      - 'itest/reminder-fixtures.ts'

concurrency:
  group: integration-org-sandbox
  queue: max
  cancel-in-progress: false

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  auth-modes:
    uses: ./.github/workflows/sandbox-auth-modes.yml
    with:
      requested_mode: ${{ inputs.auth_mode || '' }}

  sandbox:
    name: Sandbox (${{ matrix.auth_mode }})
    needs: auth-modes
    if: needs.auth-modes.outputs.modes != ''
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        auth_mode: ${{ fromJSON(needs.auth-modes.outputs.modes) }}
    uses: ./.github/workflows/itest-ensure-next-iteration-reminder.yml
    with:
      auth_mode: ${{ matrix.auth_mode }}
    secrets:
      pat_token: ${{ matrix.auth_mode == 'pat' && secrets.CI_SANDBOX_TOKEN || '' }}
      app_id: ${{ matrix.auth_mode == 'app' && secrets.ORG_AUTOMATION_APP_ID || '' }}
      app_private_key: ${{ matrix.auth_mode == 'app' && secrets.ORG_AUTOMATION_APP_PRIVATE_KEY || '' }}
