# Назначение: проверяет наличие учётных данных для PAT или GitHub App перед интеграционными тестами.
# Токен выбирается внутри каждого job: секреты нельзя передавать через меж-job outputs.
name: Validate integration test credentials

on:
  workflow_call:
    inputs:
      auth_mode:
        required: false
        default: pat
        type: string
      installation_owner:
        required: true
        type: string
    outputs:
      auth_mode:
        description: Effective auth mode used by the test run
        value: ${{ inputs.auth_mode }}
    secrets:
      pat_token:
        required: false
      app_id:
        required: false
      app_private_key:
        required: false

permissions: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate auth mode configuration
        shell: bash
        env:
          AUTH_MODE: ${{ inputs.auth_mode }}
          PAT_TOKEN: ${{ secrets.pat_token }}
          APP_ID: ${{ secrets.app_id }}
          APP_PRIVATE_KEY: ${{ secrets.app_private_key }}
        run: |
          case "$AUTH_MODE" in
            pat)
              if [ -z "$PAT_TOKEN" ]; then
                echo "pat_token secret is required when auth_mode=pat" >&2
                exit 1
              fi
              ;;
            app)
              if [ -z "$APP_ID" ] || [ -z "$APP_PRIVATE_KEY" ]; then
                echo "app_id and app_private_key secrets are required when auth_mode=app" >&2
                exit 1
              fi
              ;;
            *)
              echo "Unsupported auth_mode: $AUTH_MODE" >&2
              exit 1
              ;;
          esac
