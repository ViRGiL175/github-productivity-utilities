name: Test TypeScript implementation

on:
  pull_request:
    paths:
      - '.github/workflows/test-typescript.yml'
      - 'src/**'
      - 'test/**'
      - 'dist/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-typescript:
    name: Typecheck, unit test and verify bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Rebuild runtime bundle
        run: npm run build

      - name: Verify committed bundle is current
        run: |
          git ls-files --error-unmatch dist/run-automation.mjs
          test -s dist/run-automation.mjs
          git diff --exit-code -- dist/
