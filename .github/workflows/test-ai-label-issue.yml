# Integration test: creates real issues, runs AI label workflow, verifies labels + Project V2 fields, then cleans up.
name: Test ai-label-issue

on:
  workflow_dispatch:
    inputs:
      auth_mode:
        description: Token source to use for integration tests (pat=user sandbox, app=org sandbox)
        required: false
        default: pat
        type: choice
        options:
          - pat
          - app
      model:
        description: Optional Copilot model override for the integration run
        required: false
        default: gpt-4.1
        type: string
  pull_request:
    paths:
      - '.github/workflows/ai-label-issue.yml'
      - '.github/workflows/test-ai-label-issue.yml'
      - '.github/workflows/copilot-generate-text.yml'
      - '.secrets.example'
      - 'README.md'
      - 'scripts/run-act-test.js'

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  pull-requests: read

env:
  AUTH_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.auth_mode || 'pat' }}
  INSTALLATION_OWNER: ${{ github.event_name == 'workflow_dispatch' && inputs.auth_mode == 'app' && 'ViRGiL-GH-Productivity' || 'ViRGiL175' }}
  PROJECT_OWNER: ${{ github.event_name == 'workflow_dispatch' && inputs.auth_mode == 'app' && 'ViRGiL-GH-Productivity' || 'ViRGiL175' }}
  PROJECT_NUMBER: ${{ github.event_name == 'workflow_dispatch' && inputs.auth_mode == 'app' && '1' || '10' }}
  REPO_OWNER: ${{ github.event_name == 'workflow_dispatch' && inputs.auth_mode == 'app' && 'ViRGiL-GH-Productivity' || 'ViRGiL175' }}
  REPO_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.auth_mode == 'app' && 'scrum-test-backlog' || 'github-productivity-utilities' }}
  STATUS_FIELD_NAME: Status
  STATUS_DONE_VALUE: Done
  TEST_LABEL: itest-ai-confirmed

jobs:
  prepare-label-scenario:
    name: Prepare label scenario
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    outputs:
      project_id: ${{ steps.prepare.outputs.project_id }}
      success_issue_number: ${{ steps.prepare.outputs.success_issue_number }}
      success_issue_node_id: ${{ steps.prepare.outputs.success_issue_node_id }}
      success_issue_url: ${{ steps.prepare.outputs.success_issue_url }}
      reject_issue_number: ${{ steps.prepare.outputs.reject_issue_number }}
      reject_issue_node_id: ${{ steps.prepare.outputs.reject_issue_node_id }}
      reject_issue_url: ${{ steps.prepare.outputs.reject_issue_url }}
    steps:
      - name: Normalize GitHub App private key
        if: ${{ env.AUTH_MODE == 'app' }}
        id: normalize-key
        shell: bash
        env:
          RAW_PRIVATE_KEY: ${{ secrets.ORG_AUTOMATION_APP_PRIVATE_KEY }}
        run: |
          if [[ "$RAW_PRIVATE_KEY" == *'\n'* ]]; then
            printf 'private_key<<EOF\n%b\nEOF\n' "$RAW_PRIVATE_KEY" >> "$GITHUB_OUTPUT"
          else
            printf 'private_key<<EOF\n%s\nEOF\n' "$RAW_PRIVATE_KEY" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub App installation token
        if: ${{ env.AUTH_MODE == 'app' }}
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.ORG_AUTOMATION_APP_ID }}
          private-key: ${{ steps.normalize-key.outputs.private_key }}
          owner: ${{ env.INSTALLATION_OWNER }}
          skip-token-revoke: true

      - name: Create test issues and label
        id: prepare
        uses: actions/github-script@v9
        env:
          PROJECT_OWNER: ${{ env.PROJECT_OWNER }}
          PROJECT_NUMBER: ${{ env.PROJECT_NUMBER }}
          STATUS_FIELD_NAME: ${{ env.STATUS_FIELD_NAME }}
          STATUS_DONE_VALUE: ${{ env.STATUS_DONE_VALUE }}
          REPO_OWNER: ${{ env.REPO_OWNER }}
          REPO_NAME: ${{ env.REPO_NAME }}
          TEST_LABEL: ${{ env.TEST_LABEL }}
          SUCCESS_TITLE: ITEST-${{ github.run_id }} ai label success
          REJECT_TITLE: ITEST-${{ github.run_id }} ai label rejected
        with:
          github-token: ${{ env.AUTH_MODE == 'app' && steps.app-token.outputs.token || secrets.ORG_PROJECT_TOKEN }}
          script: |
            const headers = { accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' };
            const projectOwner = process.env.PROJECT_OWNER;
            const projectNumber = Number(process.env.PROJECT_NUMBER);
            const statusFieldName = process.env.STATUS_FIELD_NAME;
            const statusDoneValue = process.env.STATUS_DONE_VALUE;
            const owner = process.env.REPO_OWNER;
            const repo = process.env.REPO_NAME;
            const testLabel = process.env.TEST_LABEL;

            async function getProject() {
              const ownerType = (await github.request('GET /users/{username}', { username: projectOwner, headers })).data.type;
              const fields = 'id fields(first:100){nodes{__typename ... on ProjectV2FieldCommon{id name} ... on ProjectV2SingleSelectField{options{id name}}}}';
              const query = ownerType === 'Organization'
                ? `query($owner:String!,$number:Int!){organization(login:$owner){projectV2(number:$number){${fields}}}}`
                : `query($owner:String!,$number:Int!){user(login:$owner){projectV2(number:$number){${fields}}}}`;
              const data = await github.graphql(query, { owner: projectOwner, number: projectNumber });
              const project = ownerType === 'Organization' ? data.organization?.projectV2 : data.user?.projectV2;
              if (!project) throw new Error(`Project ${projectOwner}#${projectNumber} was not found.`);
              const status = project.fields.nodes.find((field) => field?.__typename === 'ProjectV2SingleSelectField' && field.name === statusFieldName);
              if (!status) throw new Error(`Status field ${statusFieldName} was not found.`);
              if (!status.options?.some((option) => option.name === statusDoneValue)) throw new Error(`Status option ${statusDoneValue} was not found.`);
              return project;
            }

            async function ensureLabel() {
              try {
                await github.request('GET /repos/{owner}/{repo}/labels/{name}', { owner, repo, name: testLabel, headers });
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.request('POST /repos/{owner}/{repo}/labels', { owner, repo, name: testLabel, color: '5319e7', description: 'Integration-test label for AI workflows.', headers });
              }
            }

            const project = await getProject();
            await ensureLabel();
            const success = await github.request('POST /repos/{owner}/{repo}/issues', {
              owner,
              repo,
              title: process.env.SUCCESS_TITLE,
              body: [
                `ITEST run ${context.runId} for ai-label success scenario.`,
                '',
                `Set the project field ${statusFieldName} to ${statusDoneValue}.`,
                `Apply the existing issue label ${testLabel}.`,
              ].join('\n'),
              headers,
            });
            const rejected = await github.request('POST /repos/{owner}/{repo}/issues', {
              owner,
              repo,
              title: process.env.REJECT_TITLE,
              body: [
                `ITEST run ${context.runId} for ai-label rejected scenario.`,
                '',
                'This issue intentionally does not include enough information to choose any allowed project field value or issue label.',
              ].join('\n'),
              headers,
            });

            core.setOutput('project_id', project.id);
            core.setOutput('success_issue_number', String(success.data.number));
            core.setOutput('success_issue_node_id', success.data.node_id);
            core.setOutput('success_issue_url', success.data.html_url);
            core.setOutput('reject_issue_number', String(rejected.data.number));
            core.setOutput('reject_issue_node_id', rejected.data.node_id);
            core.setOutput('reject_issue_url', rejected.data.html_url);

  run-label-success-scenario:
    name: Run label success scenario
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    needs:
      - prepare-label-scenario
    uses: ./.github/workflows/ai-label-issue.yml
    with:
      issue_url: ${{ needs.prepare-label-scenario.outputs.success_issue_url }}
      project_owner: ${{ github.event_name == 'workflow_dispatch' && inputs.auth_mode == 'app' && 'ViRGiL-GH-Productivity' || 'ViRGiL175' }}
      project_number: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.auth_mode == 'app' && '1' || '10') }}
      allowed_fields: |
        labels
        Status
      model: ${{ github.event_name == 'workflow_dispatch' && inputs.model || 'gpt-4.1' }}
      auth_mode: ${{ github.event_name == 'workflow_dispatch' && inputs.auth_mode || 'pat' }}
      installation_owner: ${{ github.event_name == 'workflow_dispatch' && inputs.auth_mode == 'app' && 'ViRGiL-GH-Productivity' || 'ViRGiL175' }}
    secrets:
      pat_token: ${{ secrets.ORG_PROJECT_TOKEN }}
      app_id: ${{ secrets.ORG_AUTOMATION_APP_ID }}
      app_private_key: ${{ secrets.ORG_AUTOMATION_APP_PRIVATE_KEY }}
      copilot_token: ${{ secrets.USER_COPILOT_FGPAT }}

  assert-label-success-scenario:
    name: Assert label success scenario
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    needs:
      - prepare-label-scenario
      - run-label-success-scenario
    runs-on: ubuntu-latest
    steps:
      - name: Normalize GitHub App private key
        if: ${{ env.AUTH_MODE == 'app' }}
        id: normalize-key
        shell: bash
        env:
          RAW_PRIVATE_KEY: ${{ secrets.ORG_AUTOMATION_APP_PRIVATE_KEY }}
        run: |
          if [[ "$RAW_PRIVATE_KEY" == *'\n'* ]]; then
            printf 'private_key<<EOF\n%b\nEOF\n' "$RAW_PRIVATE_KEY" >> "$GITHUB_OUTPUT"
          else
            printf 'private_key<<EOF\n%s\nEOF\n' "$RAW_PRIVATE_KEY" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub App installation token
        if: ${{ env.AUTH_MODE == 'app' }}
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.ORG_AUTOMATION_APP_ID }}
          private-key: ${{ steps.normalize-key.outputs.private_key }}
          owner: ${{ env.INSTALLATION_OWNER }}
          skip-token-revoke: true

      - name: Assert label and project field were set
        uses: actions/github-script@v9
        env:
          PROJECT_ID: ${{ needs.prepare-label-scenario.outputs.project_id }}
          ISSUE_NUMBER: ${{ needs.prepare-label-scenario.outputs.success_issue_number }}
          ISSUE_NODE_ID: ${{ needs.prepare-label-scenario.outputs.success_issue_node_id }}
          REPO_OWNER: ${{ env.REPO_OWNER }}
          REPO_NAME: ${{ env.REPO_NAME }}
          STATUS_FIELD_NAME: ${{ env.STATUS_FIELD_NAME }}
          STATUS_DONE_VALUE: ${{ env.STATUS_DONE_VALUE }}
          TEST_LABEL: ${{ env.TEST_LABEL }}
        with:
          github-token: ${{ env.AUTH_MODE == 'app' && steps.app-token.outputs.token || secrets.ORG_PROJECT_TOKEN }}
          script: |
            const headers = { accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' };
            const owner = process.env.REPO_OWNER;
            const repo = process.env.REPO_NAME;
            const issueNumber = Number(process.env.ISSUE_NUMBER);
            const issueNodeId = process.env.ISSUE_NODE_ID;
            const projectId = process.env.PROJECT_ID;
            const statusFieldName = process.env.STATUS_FIELD_NAME;
            const statusDoneValue = process.env.STATUS_DONE_VALUE;
            const testLabel = process.env.TEST_LABEL;
            const issue = await github.request('GET /repos/{owner}/{repo}/issues/{issue_number}', { owner, repo, issue_number: issueNumber, headers });
            const labels = (issue.data.labels ?? []).map((label) => label.name);
            if (!labels.includes(testLabel)) throw new Error(`Expected ${testLabel} label, got: ${labels.join(', ') || 'none'}.`);
            if (!labels.includes('ai-label-processed')) throw new Error(`Expected ai-label-processed label, got: ${labels.join(', ') || 'none'}.`);
            if (labels.includes('ai-label-rejected')) throw new Error('Did not expect ai-label-rejected label on success scenario.');

            const query = `query($issueId:ID!,$statusFieldName:String!){node(id:$issueId){... on Issue{projectItems(first:100){nodes{id project{id} fieldValueByName(name:$statusFieldName){... on ProjectV2ItemFieldSingleSelectValue{name}}}}}}}`;
            const data = await github.graphql(query, { issueId: issueNodeId, statusFieldName });
            const item = data.node?.projectItems?.nodes?.find((node) => node.project?.id === projectId) ?? null;
            if (!item) throw new Error('Expected issue to be added to the project.');
            const actualStatus = item.fieldValueByName?.name ?? null;
            if (actualStatus !== statusDoneValue) throw new Error(`Expected ${statusFieldName}=${statusDoneValue}, got ${actualStatus || 'none'}.`);

  run-label-rejected-scenario:
    name: Run label rejected scenario
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    needs:
      - prepare-label-scenario
      - assert-label-success-scenario
    uses: ./.github/workflows/ai-label-issue.yml
    with:
      issue_url: ${{ needs.prepare-label-scenario.outputs.reject_issue_url }}
      project_owner: ${{ github.event_name == 'workflow_dispatch' && inputs.auth_mode == 'app' && 'ViRGiL-GH-Productivity' || 'ViRGiL175' }}
      project_number: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.auth_mode == 'app' && '1' || '10') }}
      allowed_fields: |
        labels
        Status
      model: ${{ github.event_name == 'workflow_dispatch' && inputs.model || 'gpt-4.1' }}
      auth_mode: ${{ github.event_name == 'workflow_dispatch' && inputs.auth_mode || 'pat' }}
      installation_owner: ${{ github.event_name == 'workflow_dispatch' && inputs.auth_mode == 'app' && 'ViRGiL-GH-Productivity' || 'ViRGiL175' }}
    secrets:
      pat_token: ${{ secrets.ORG_PROJECT_TOKEN }}
      app_id: ${{ secrets.ORG_AUTOMATION_APP_ID }}
      app_private_key: ${{ secrets.ORG_AUTOMATION_APP_PRIVATE_KEY }}
      copilot_token: ${{ secrets.USER_COPILOT_FGPAT }}

  assert-label-rejected-scenario:
    name: Assert label rejected scenario
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    needs:
      - prepare-label-scenario
      - run-label-rejected-scenario
    runs-on: ubuntu-latest
    steps:
      - name: Normalize GitHub App private key
        if: ${{ env.AUTH_MODE == 'app' }}
        id: normalize-key
        shell: bash
        env:
          RAW_PRIVATE_KEY: ${{ secrets.ORG_AUTOMATION_APP_PRIVATE_KEY }}
        run: |
          if [[ "$RAW_PRIVATE_KEY" == *'\n'* ]]; then
            printf 'private_key<<EOF\n%b\nEOF\n' "$RAW_PRIVATE_KEY" >> "$GITHUB_OUTPUT"
          else
            printf 'private_key<<EOF\n%s\nEOF\n' "$RAW_PRIVATE_KEY" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub App installation token
        if: ${{ env.AUTH_MODE == 'app' }}
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.ORG_AUTOMATION_APP_ID }}
          private-key: ${{ steps.normalize-key.outputs.private_key }}
          owner: ${{ env.INSTALLATION_OWNER }}
          skip-token-revoke: true

      - name: Assert rejected labels were set
        uses: actions/github-script@v9
        env:
          ISSUE_NUMBER: ${{ needs.prepare-label-scenario.outputs.reject_issue_number }}
          REPO_OWNER: ${{ env.REPO_OWNER }}
          REPO_NAME: ${{ env.REPO_NAME }}
        with:
          github-token: ${{ env.AUTH_MODE == 'app' && steps.app-token.outputs.token || secrets.ORG_PROJECT_TOKEN }}
          script: |
            const headers = { accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' };
            const owner = process.env.REPO_OWNER;
            const repo = process.env.REPO_NAME;
            const issueNumber = Number(process.env.ISSUE_NUMBER);
            const issue = await github.request('GET /repos/{owner}/{repo}/issues/{issue_number}', { owner, repo, issue_number: issueNumber, headers });
            const labels = (issue.data.labels ?? []).map((label) => label.name);
            if (!labels.includes('ai-label-rejected')) throw new Error(`Expected ai-label-rejected label, got: ${labels.join(', ') || 'none'}.`);
            if (!labels.includes('ai-label-processed')) throw new Error(`Expected ai-label-processed label, got: ${labels.join(', ') || 'none'}.`);

  cleanup-label-scenario:
    name: Cleanup label scenario
    if: ${{ always() && needs.prepare-label-scenario.outputs.success_issue_number != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    needs:
      - prepare-label-scenario
      - run-label-success-scenario
      - assert-label-success-scenario
      - run-label-rejected-scenario
      - assert-label-rejected-scenario
    runs-on: ubuntu-latest
    steps:
      - name: Normalize GitHub App private key
        if: ${{ env.AUTH_MODE == 'app' }}
        id: normalize-key
        shell: bash
        env:
          RAW_PRIVATE_KEY: ${{ secrets.ORG_AUTOMATION_APP_PRIVATE_KEY }}
        run: |
          if [[ "$RAW_PRIVATE_KEY" == *'\n'* ]]; then
            printf 'private_key<<EOF\n%b\nEOF\n' "$RAW_PRIVATE_KEY" >> "$GITHUB_OUTPUT"
          else
            printf 'private_key<<EOF\n%s\nEOF\n' "$RAW_PRIVATE_KEY" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub App installation token
        if: ${{ env.AUTH_MODE == 'app' }}
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.ORG_AUTOMATION_APP_ID }}
          private-key: ${{ steps.normalize-key.outputs.private_key }}
          owner: ${{ env.INSTALLATION_OWNER }}
          skip-token-revoke: true

      - name: Remove project items and close issues
        uses: actions/github-script@v9
        env:
          PROJECT_ID: ${{ needs.prepare-label-scenario.outputs.project_id }}
          SUCCESS_ISSUE_NUMBER: ${{ needs.prepare-label-scenario.outputs.success_issue_number }}
          SUCCESS_ISSUE_NODE_ID: ${{ needs.prepare-label-scenario.outputs.success_issue_node_id }}
          REJECT_ISSUE_NUMBER: ${{ needs.prepare-label-scenario.outputs.reject_issue_number }}
          REJECT_ISSUE_NODE_ID: ${{ needs.prepare-label-scenario.outputs.reject_issue_node_id }}
          REPO_OWNER: ${{ env.REPO_OWNER }}
          REPO_NAME: ${{ env.REPO_NAME }}
        with:
          github-token: ${{ env.AUTH_MODE == 'app' && steps.app-token.outputs.token || secrets.ORG_PROJECT_TOKEN }}
          script: |
            const headers = { accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' };
            const projectId = process.env.PROJECT_ID;
            const owner = process.env.REPO_OWNER;
            const repo = process.env.REPO_NAME;
            const issues = [
              { number: Number(process.env.SUCCESS_ISSUE_NUMBER), nodeId: process.env.SUCCESS_ISSUE_NODE_ID },
              { number: Number(process.env.REJECT_ISSUE_NUMBER), nodeId: process.env.REJECT_ISSUE_NODE_ID },
            ];
            const query = `query($issueId:ID!){node(id:$issueId){... on Issue{projectItems(first:100){nodes{id project{id}}}}}}`;
            const mutation = `mutation($input:DeleteProjectV2ItemInput!){deleteProjectV2Item(input:$input){deletedItemId}}`;
            for (const issue of issues) {
              if (issue.nodeId && projectId) {
                const data = await github.graphql(query, { issueId: issue.nodeId });
                const item = data.node?.projectItems?.nodes?.find((projectItem) => projectItem.project?.id === projectId) ?? null;
                if (item) await github.graphql(mutation, { input: { projectId, itemId: item.id } });
              }
              if (issue.number > 0) await github.request('PATCH /repos/{owner}/{repo}/issues/{issue_number}', { owner, repo, issue_number: issue.number, state: 'closed', headers });
            }

  prepare-label-type-scenario:
    name: Prepare native issue type scenario
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    outputs:
      issue_number: ${{ steps.prepare.outputs.issue_number }}
      issue_node_id: ${{ steps.prepare.outputs.issue_node_id }}
      issue_url: ${{ steps.prepare.outputs.issue_url }}
      expected_type: ${{ steps.prepare.outputs.expected_type }}
    steps:
      - name: Normalize GitHub App private key
        id: normalize-key
        shell: bash
        env:
          RAW_PRIVATE_KEY: ${{ secrets.ORG_AUTOMATION_APP_PRIVATE_KEY }}
        run: |
          if [[ "$RAW_PRIVATE_KEY" == *'\n'* ]]; then
            printf 'private_key<<EOF\n%b\nEOF\n' "$RAW_PRIVATE_KEY" >> "$GITHUB_OUTPUT"
          else
            printf 'private_key<<EOF\n%s\nEOF\n' "$RAW_PRIVATE_KEY" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.ORG_AUTOMATION_APP_ID }}
          private-key: ${{ steps.normalize-key.outputs.private_key }}
          owner: ViRGiL-GH-Productivity
          skip-token-revoke: true

      - name: Create test issue and label
        id: prepare
        uses: actions/github-script@v9
        env:
          REPO_OWNER: ViRGiL-GH-Productivity
          REPO_NAME: scrum-test-backlog
          TEST_LABEL: ${{ env.TEST_LABEL }}
          EXPECTED_TYPE: Feature
          TYPE_TITLE: ITEST-${{ github.run_id }} ai label native type
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const headers = { accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' };
            const owner = process.env.REPO_OWNER;
            const repo = process.env.REPO_NAME;
            const testLabel = process.env.TEST_LABEL;
            const expectedType = process.env.EXPECTED_TYPE;

            const typeQuery = `query($owner:String!){organization(login:$owner){issueTypes(first:100){nodes{name isEnabled}}}}`;
            const typeData = await github.graphql(typeQuery, { owner });
            const enabledTypes = (typeData.organization?.issueTypes?.nodes ?? []).filter((type) => type?.isEnabled).map((type) => type.name);
            if (!enabledTypes.includes(expectedType)) throw new Error(`Expected native issue type ${expectedType} to be enabled. Enabled types: ${enabledTypes.join(', ') || 'none'}.`);

            try {
              await github.request('GET /repos/{owner}/{repo}/labels/{name}', { owner, repo, name: testLabel, headers });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.request('POST /repos/{owner}/{repo}/labels', { owner, repo, name: testLabel, color: '5319e7', description: 'Integration-test label for AI workflows.', headers });
            }

            const issue = await github.request('POST /repos/{owner}/{repo}/issues', {
              owner,
              repo,
              title: process.env.TYPE_TITLE,
              body: [
                `ITEST run ${context.runId} for ai-label native issue type scenario.`,
                '',
                `Apply the existing issue label ${testLabel}.`,
                `Set the native GitHub Issue Type to ${expectedType}.`,
              ].join('\n'),
              headers,
            });

            core.setOutput('issue_number', String(issue.data.number));
            core.setOutput('issue_node_id', issue.data.node_id);
            core.setOutput('issue_url', issue.data.html_url);
            core.setOutput('expected_type', expectedType);

  run-label-type-scenario:
    name: Run native issue type scenario
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    needs:
      - prepare-label-type-scenario
    uses: ./.github/workflows/ai-label-issue.yml
    with:
      issue_url: ${{ needs.prepare-label-type-scenario.outputs.issue_url }}
      project_owner: ViRGiL-GH-Productivity
      project_number: 1
      allowed_fields: |
        labels
        type
      model: ${{ github.event_name == 'workflow_dispatch' && inputs.model || 'gpt-4.1' }}
      auth_mode: app
      installation_owner: ViRGiL-GH-Productivity
    secrets:
      app_id: ${{ secrets.ORG_AUTOMATION_APP_ID }}
      app_private_key: ${{ secrets.ORG_AUTOMATION_APP_PRIVATE_KEY }}
      copilot_token: ${{ secrets.USER_COPILOT_FGPAT }}

  assert-label-type-scenario:
    name: Assert native issue type scenario
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    needs:
      - prepare-label-type-scenario
      - run-label-type-scenario
    runs-on: ubuntu-latest
    steps:
      - name: Normalize GitHub App private key
        id: normalize-key
        shell: bash
        env:
          RAW_PRIVATE_KEY: ${{ secrets.ORG_AUTOMATION_APP_PRIVATE_KEY }}
        run: |
          if [[ "$RAW_PRIVATE_KEY" == *'\n'* ]]; then
            printf 'private_key<<EOF\n%b\nEOF\n' "$RAW_PRIVATE_KEY" >> "$GITHUB_OUTPUT"
          else
            printf 'private_key<<EOF\n%s\nEOF\n' "$RAW_PRIVATE_KEY" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.ORG_AUTOMATION_APP_ID }}
          private-key: ${{ steps.normalize-key.outputs.private_key }}
          owner: ViRGiL-GH-Productivity
          skip-token-revoke: true

      - name: Assert label and native issue type were set
        uses: actions/github-script@v9
        env:
          ISSUE_NUMBER: ${{ needs.prepare-label-type-scenario.outputs.issue_number }}
          ISSUE_NODE_ID: ${{ needs.prepare-label-type-scenario.outputs.issue_node_id }}
          REPO_OWNER: ViRGiL-GH-Productivity
          REPO_NAME: scrum-test-backlog
          TEST_LABEL: ${{ env.TEST_LABEL }}
          EXPECTED_TYPE: ${{ needs.prepare-label-type-scenario.outputs.expected_type }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const headers = { accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' };
            const owner = process.env.REPO_OWNER;
            const repo = process.env.REPO_NAME;
            const issueNumber = Number(process.env.ISSUE_NUMBER);
            const issueNodeId = process.env.ISSUE_NODE_ID;
            const testLabel = process.env.TEST_LABEL;
            const expectedType = process.env.EXPECTED_TYPE;

            const issue = await github.request('GET /repos/{owner}/{repo}/issues/{issue_number}', { owner, repo, issue_number: issueNumber, headers });
            const labels = (issue.data.labels ?? []).map((label) => label.name);
            if (!labels.includes(testLabel)) throw new Error(`Expected ${testLabel} label, got: ${labels.join(', ') || 'none'}.`);
            if (!labels.includes('ai-label-processed')) throw new Error(`Expected ai-label-processed label, got: ${labels.join(', ') || 'none'}.`);
            if (labels.includes('ai-label-rejected')) throw new Error('Did not expect ai-label-rejected label on native issue type scenario.');

            const query = `query($issueId:ID!){node(id:$issueId){... on Issue{issueType{name}}}}`;
            const data = await github.graphql(query, { issueId: issueNodeId });
            const actualType = data.node?.issueType?.name ?? null;
            if (actualType !== expectedType) throw new Error(`Expected native issue type ${expectedType}, got ${actualType || 'none'}.`);

  cleanup-label-type-scenario:
    name: Cleanup native issue type scenario
    if: ${{ always() && needs.prepare-label-type-scenario.outputs.issue_number != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    needs:
      - prepare-label-type-scenario
      - run-label-type-scenario
      - assert-label-type-scenario
    runs-on: ubuntu-latest
    steps:
      - name: Normalize GitHub App private key
        id: normalize-key
        shell: bash
        env:
          RAW_PRIVATE_KEY: ${{ secrets.ORG_AUTOMATION_APP_PRIVATE_KEY }}
        run: |
          if [[ "$RAW_PRIVATE_KEY" == *'\n'* ]]; then
            printf 'private_key<<EOF\n%b\nEOF\n' "$RAW_PRIVATE_KEY" >> "$GITHUB_OUTPUT"
          else
            printf 'private_key<<EOF\n%s\nEOF\n' "$RAW_PRIVATE_KEY" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.ORG_AUTOMATION_APP_ID }}
          private-key: ${{ steps.normalize-key.outputs.private_key }}
          owner: ViRGiL-GH-Productivity
          skip-token-revoke: true

      - name: Close test issue
        uses: actions/github-script@v9
        env:
          ISSUE_NUMBER: ${{ needs.prepare-label-type-scenario.outputs.issue_number }}
          REPO_OWNER: ViRGiL-GH-Productivity
          REPO_NAME: scrum-test-backlog
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const headers = { accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' };
            const issueNumber = Number(process.env.ISSUE_NUMBER);
            if (issueNumber > 0) {
              await github.request('PATCH /repos/{owner}/{repo}/issues/{issue_number}', {
                owner: process.env.REPO_OWNER,
                repo: process.env.REPO_NAME,
                issue_number: issueNumber,
                state: 'closed',
                headers,
              });
            }

  test-skipped-for-fork-pr:
    name: Test skipped for fork PR
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
    runs-on: ubuntu-latest
    steps:
      - name: Explain why test is skipped
        run: echo "Skipping integration test for fork pull requests because repository secrets are unavailable."
