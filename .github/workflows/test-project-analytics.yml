name: Test project analytics

on:
  pull_request:
    paths:
      - '.github/workflows/test-project-analytics.yml'
      - 'analytics/**'
      - 'src/analytics/**'
      - 'src/github/ProjectV2Repository.ts'
      - 'scripts/local-analytics.mjs'
      - 'itest/project-analytics.ts'
      - 'itest/analytics-sandbox.ts'
      - 'package*.json'
      - 'tsconfig*.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: project-analytics-sandbox
  cancel-in-progress: false

jobs:
  end-to-end:
    name: GitHub → PostgreSQL → Grafana
    if: >-
      github.actor != 'dependabot[bot]' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.pull_request.head.repo.full_name == github.repository &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GITHUB_APP_ID: ${{ secrets.ORG_AUTOMATION_APP_ID }}
      GITHUB_APP_PRIVATE_KEY_FILE: .local/secrets/github-app.pem
      ALLOW_GITHUB_APP_KEY_READ: 'true'
      PGHOST: 127.0.0.1
      PGPORT: '55432'
      PGPASSWORD_FILE: .local/secrets/database-writer
      COMPOSE_PROJECT_NAME: analytics-e2e-${{ github.run_id }}-${{ github.run_attempt }}
      GRAFANA_TLS_CERT_FILE: ${{ github.workspace }}/.local/tls/server.crt
      GRAFANA_TLS_KEY_FILE: ${{ github.workspace }}/.local/secrets/grafana-tls.key
      GRAFANA_TLS_CA_FILE: ${{ github.workspace }}/.local/tls/ca.crt
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build collector
        run: npm run analytics:build
      - name: Prepare ephemeral configuration
        env:
          RAW_PRIVATE_KEY: ${{ secrets.ORG_AUTOMATION_APP_PRIVATE_KEY }}
        run: |
          node scripts/local-analytics.mjs init
          node --input-type=module <<'JS'
          import { appendFileSync, writeFileSync } from 'node:fs';
          import { analyticsSandbox } from './itest/analytics-sandbox.ts';
          if (!process.env.GITHUB_APP_ID) throw new Error('Missing ORG_AUTOMATION_APP_ID repository secret');
          if (!process.env.RAW_PRIVATE_KEY) throw new Error('Missing ORG_AUTOMATION_APP_PRIVATE_KEY repository secret');
          const key = process.env.RAW_PRIVATE_KEY.replace(/\\n/g, '\n');
          for (const line of key.split(/\r?\n/).filter(Boolean)) console.log(`::add-mask::${line}`);
          writeFileSync(process.env.GITHUB_APP_PRIVATE_KEY_FILE, key, { mode: 0o600 });
          writeFileSync('.local/analytics.env', '', { mode: 0o600 });
          const sandbox = await analyticsSandbox();
          const settings = { PROJECT_OWNER: sandbox.owner, PROJECT_NUMBER: sandbox.number,
            GITHUB_REPOSITORIES: sandbox.repositories.join(','), FIXTURE_REPOSITORY: sandbox.backlog };
          for (const value of [sandbox.owner, ...sandbox.repositories]) console.log(`::add-mask::${value}`);
          appendFileSync(process.env.GITHUB_ENV, Object.entries(settings).map(([key, value]) => `${key}=${value}\n`).join(''));
          JS
      - name: Create a temporary test CA and localhost certificate
        run: |
          umask 077
          mkdir -p .local/tls
          openssl req -x509 -newkey rsa:2048 -noenc -sha256 -days 1 \
            -subj '/CN=Analytics E2E CA' -addext 'basicConstraints=critical,CA:TRUE' \
            -addext 'keyUsage=critical,keyCertSign,cRLSign' \
            -keyout .local/secrets/test-ca.key -out "$GRAFANA_TLS_CA_FILE"
          openssl req -new -newkey rsa:2048 -noenc -sha256 -subj '/CN=localhost' \
            -keyout "$GRAFANA_TLS_KEY_FILE" -out .local/tls/server.csr
          printf '%s\n' 'basicConstraints=critical,CA:FALSE' \
            'keyUsage=critical,digitalSignature,keyEncipherment' 'extendedKeyUsage=serverAuth' \
            'subjectAltName=DNS:localhost,IP:127.0.0.1' > .local/tls/server.ext
          openssl x509 -req -in .local/tls/server.csr -CA "$GRAFANA_TLS_CA_FILE" \
            -CAkey .local/secrets/test-ca.key -CAcreateserial -days 1 -sha256 \
            -extfile .local/tls/server.ext -out "$GRAFANA_TLS_CERT_FILE"
      - name: Create sandbox fixture token
        id: fixture-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.ORG_AUTOMATION_APP_ID }}
          private-key: ${{ secrets.ORG_AUTOMATION_APP_PRIVATE_KEY }}
          owner: ${{ env.PROJECT_OWNER }}
          repositories: ${{ env.FIXTURE_REPOSITORY }}
          permission-organization-projects: write
          permission-issues: write
          permission-metadata: read
      - name: Start clean PostgreSQL and Grafana
        run: |
          # File-backed Compose secrets retain host ownership on Linux.
          # Grant only the runtime UIDs access to their explicitly mounted secrets.
          setfacl -m u:70:r .local/secrets/database-admin .local/secrets/database-writer .local/secrets/database-reader
          setfacl -m u:472:r .local/secrets/database-reader .local/secrets/grafana-admin .local/secrets/grafana-encryption
          setfacl -m u:472:r "$GRAFANA_TLS_CERT_FILE" "$GRAFANA_TLS_KEY_FILE" "$GRAFANA_TLS_CA_FILE"
          docker compose --env-file .local/analytics.env -f analytics/compose.yaml -f analytics/compose.https.yaml up -d --wait --wait-timeout 180
      - name: Import, reconcile, and query the fixture
        env:
          FIXTURE_TOKEN: ${{ steps.fixture-token.outputs.token }}
        run: node itest/project-analytics.ts
      - name: Clean up only this run's GitHub fixture
        if: ${{ always() && steps.fixture-token.outputs.token != '' }}
        env:
          FIXTURE_TOKEN: ${{ steps.fixture-token.outputs.token }}
        run: node itest/project-analytics.ts cleanup
      - name: Remove ephemeral containers, volumes, and credentials
        if: always()
        run: |
          if [ -f .local/analytics.env ]; then
            docker compose --env-file .local/analytics.env -f analytics/compose.yaml -f analytics/compose.https.yaml down --volumes
          fi
          rm -rf -- .local
