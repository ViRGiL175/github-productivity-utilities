# Назначение: добавляет PR в Project V2, синхронизирует sprint, assignee, closing reference и статус по событиям PR.
# Когда использовать: как reusable workflow на opened, reopened, edited, synchronize, review_requested и closed для поддержки связи PR с backlog issue и проектом.
name: Link PR to Project

on:
  workflow_call:
    inputs:
      field_updates:
        description: Optional YAML with project/issue field dictionaries and force (default false)
        type: string
        required: false
        default: ''
      project_owner:
        description: Login of the organization or user that owns the Project V2 board
        required: true
        type: string
      project_number:
        description: Project V2 number
        required: true
        type: number
      backlog_repo:
        description: Repository name where backlog issues live
        required: true
        type: string
      backlog_repo_owner:
        description: Owner of the repository where backlog issues live; defaults to project_owner when omitted
        required: false
        type: string
      iteration_field_name:
        description: Name of the iteration field in the project
        required: false
        default: Sprint
        type: string
      status_field_name:
        description: Name of the status field in the project
        required: false
        default: Status
        type: string
      status_done_value:
        description: Status value to set when the PR is closed
        required: false
        default: Done
        type: string
      status_in_progress_value:
        description: Status value for a new PR, a linked Todo PR, or a Todo PR and open closing issues on synchronize; skipped when omitted
        required: false
        type: string
      status_in_review_value:
        description: Status value to set when a human reviewer is requested on the PR; skipped when omitted
        required: false
        type: string
      pull_request_node_id:
        description: Pull request node ID override; falls back to github.event.pull_request.node_id when omitted
        required: false
        type: string
      pull_request_number:
        description: Pull request number override; falls back to github.event.pull_request.number when omitted
        required: false
        type: string
      pull_request_repo_owner:
        description: Pull request repository owner override; falls back to github.event.pull_request.base.repo.owner.login when omitted
        required: false
        type: string
      pull_request_repo_name:
        description: Pull request repository name override; falls back to the event or caller repository when omitted
        required: false
        type: string
      pull_request_body:
        description: Pull request body override hint; falls back to the live API body when omitted
        required: false
        type: string
      pull_request_author_login:
        description: Pull request author login override; falls back to github.event.pull_request.user.login when omitted
        required: false
        type: string
      head_ref:
        description: Head ref override; falls back to github.event.pull_request.head.ref when omitted
        required: false
        type: string
      repositories:
        description: Newline-delimited PR repositories to scan when action=reconcile_sprints
        required: false
        type: string
      reconcile_pull_request_number:
        description: Optional PR number to limit a Sprint reconciliation run to one PR
        required: false
        default: 0
        type: number
      action:
        description: Action override; falls back to github.event.action when omitted
        required: false
        type: string
      review_state:
        description: Review decision override; falls back to github.event.review.state when omitted
        required: false
        type: string
      review_actor_login:
        description: Reviewer login override for completed or removed review requests
        required: false
        type: string
      review_actor_type:
        description: Reviewer actor type override, for example User or Bot
        required: false
        type: string
      requested_reviewers_json:
        description: JSON array of requested reviewers with login fields; falls back to github.event.pull_request.requested_reviewers when omitted
        required: false
        type: string
      auth_mode:
        description: Auth mode used to resolve a token when project_token is not provided
        required: false
        default: pat
        type: string
      installation_owner:
        description: Installation owner used to mint a GitHub App token when auth_mode=app
        required: false
        type: string
    secrets:
      project_token:
        required: false
      pat_token:
        required: false
      app_id:
        required: false
      app_private_key:
        required: false

jobs:
  sync-pr-with-project:
    name: Sync PR with project
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
    env:
      AUTH_MODE: ${{ inputs.auth_mode }}
      INSTALLATION_OWNER: ${{ inputs.installation_owner }}
      DIRECT_TOKEN: ${{ secrets.project_token }}
      PAT_TOKEN: ${{ secrets.pat_token }}
      APP_ID: ${{ secrets.app_id }}
      APP_PRIVATE_KEY: ${{ secrets.app_private_key }}

    steps:
      - name: Check workflow credentials
        id: credentials
        shell: bash
        env:
          PR_AUTHOR: ${{ inputs.pull_request_author_login || github.event.pull_request.user.login }}
        run: |
          if [[ -n "$DIRECT_TOKEN" ]]; then exit 0; fi
          case "$AUTH_MODE" in
            pat)
              if [[ -n "$PAT_TOKEN" ]]; then exit 0; fi
              missing="pat_token"
              ;;
            app)
              if [[ -n "$APP_ID" && -n "$APP_PRIVATE_KEY" && -n "$INSTALLATION_OWNER" ]]; then exit 0; fi
              missing="app_id, app_private_key and installation_owner"
              ;;
            *) echo "::error::Unsupported auth mode"; exit 1 ;;
          esac
          if [[ "$PR_AUTHOR" == 'dependabot[bot]' ]]; then
            echo "Skipping Dependabot PR without credentials."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Missing $missing for auth_mode=$AUTH_MODE"
            exit 1
          fi

      - name: Create GitHub App installation token
        if: steps.credentials.outputs.skip != 'true' && env.DIRECT_TOKEN == '' && env.AUTH_MODE == 'app'
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.app_id }}
          private-key: ${{ secrets.app_private_key }}
          owner: ${{ inputs.installation_owner }}
          skip-token-revoke: true

      - name: Checkout automation implementation
        if: &run-sync steps.credentials.outputs.skip != 'true'
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .github-productivity-utilities-runtime

      - name: Install optional field updates parser
        if: steps.credentials.outputs.skip != 'true' && inputs.field_updates != ''
        working-directory: .github-productivity-utilities-runtime
        run: npm ci --omit=dev --ignore-scripts

      - name: Sync PR metadata with project
        if: *run-sync
        uses: actions/github-script@v9
        env:
          FIELD_UPDATES: ${{ inputs.field_updates }}
          PROJECT_OWNER: ${{ inputs.project_owner }}
          PROJECT_NUMBER: ${{ inputs.project_number }}
          BACKLOG_REPO: ${{ inputs.backlog_repo }}
          BACKLOG_REPO_OWNER: ${{ inputs.backlog_repo_owner || inputs.project_owner }}
          ITERATION_FIELD_NAME: ${{ inputs.iteration_field_name }}
          STATUS_FIELD_NAME: ${{ inputs.status_field_name }}
          STATUS_DONE_VALUE: ${{ inputs.status_done_value }}
          STATUS_IN_PROGRESS_VALUE: ${{ inputs.status_in_progress_value }}
          STATUS_IN_REVIEW_VALUE: ${{ inputs.status_in_review_value }}
          PULL_REQUEST_NODE_ID: ${{ inputs.pull_request_node_id || github.event.pull_request.node_id }}
          PULL_REQUEST_NUMBER: ${{ inputs.pull_request_number || github.event.pull_request.number }}
          PULL_REQUEST_REPO_OWNER: ${{ inputs.pull_request_repo_owner || github.event.pull_request.base.repo.owner.login || github.repository_owner }}
          PULL_REQUEST_REPO_NAME: ${{ inputs.pull_request_repo_name || github.event.pull_request.base.repo.name || github.repository }}
          # The caller event can describe another PR (for example, an integration-test PR).
          # Without an explicit body, the implementation reads the target PR from its repository.
          PULL_REQUEST_BODY: ${{ inputs.pull_request_body || '' }}
          HEAD_REF: ${{ inputs.head_ref || github.event.pull_request.head.ref || '' }}
          REPOSITORIES: ${{ inputs.repositories }}
          RECONCILE_PULL_REQUEST_NUMBER: ${{ inputs.reconcile_pull_request_number }}
          ACTION: ${{ inputs.action || github.event.action || 'opened' }}
          REVIEW_STATE: ${{ inputs.review_state || github.event.review.state || '' }}
          REVIEW_ACTOR_LOGIN: ${{ inputs.review_actor_login || github.event.requested_reviewer.login || github.event.review.user.login || '' }}
          REVIEW_ACTOR_TYPE: ${{ inputs.review_actor_type || github.event.requested_reviewer.type || github.event.review.user.type || '' }}
          REQUESTED_REVIEWERS_JSON: ${{ inputs.requested_reviewers_json || toJSON(github.event.pull_request.requested_reviewers) }}
        with:
          github-token: ${{ env.DIRECT_TOKEN || (env.AUTH_MODE == 'pat' && env.PAT_TOKEN) || steps.app-token.outputs.token }}
          script: |
            const scriptName = process.env.ACTION === 'reconcile_sprints'
              ? 'reconcile-open-pr-sprints.ts'
              : 'link-pr-to-project.ts'
            const { run } = await import(`${process.env.GITHUB_WORKSPACE}/.github-productivity-utilities-runtime/src/scripts/${scriptName}`)
            await run(github)
