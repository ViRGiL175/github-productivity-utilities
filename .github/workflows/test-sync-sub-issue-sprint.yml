# Integration test: создаёт parent issue и sub-issue,
# назначает sprint родителю и проверяет наследование sprint дочерней issue.
name: Test sync-sub-issue-sprint

on:
  workflow_dispatch:
    inputs:
      auth_mode:
        description: Token source to use for integration tests (pat=CI_SANDBOX_TOKEN, app=GitHub App; both use org sandbox)
        required: false
        default: pat
        type: choice
        options:
          - pat
          - app
  pull_request:
    paths:
      - '.github/workflows/resolve-integration-test-token.yml'
      - '.github/workflows/sync-sub-issue-sprint.yml'
      - '.github/workflows/test-sync-sub-issue-sprint.yml'
      - '.github/workflows/sandbox-auth-modes.yml'
      - '.github/workflows/itest-sync-sub-issue-sprint.yml'
      - '.github/workflows/test-typescript.yml'
      - 'src/**'
      - 'test/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'

concurrency:
  group: integration-org-sandbox
  queue: max
  cancel-in-progress: false

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  auth-modes:
    uses: ./.github/workflows/sandbox-auth-modes.yml
    with:
      requested_mode: ${{ inputs.auth_mode || '' }}

  sandbox:
    name: Sandbox (${{ matrix.auth_mode }})
    needs: auth-modes
    if: needs.auth-modes.outputs.modes != ''
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        auth_mode: ${{ fromJSON(needs.auth-modes.outputs.modes) }}
    uses: ./.github/workflows/itest-sync-sub-issue-sprint.yml
    with:
      auth_mode: ${{ matrix.auth_mode }}
    secrets:
      pat_token: ${{ matrix.auth_mode == 'pat' && secrets.CI_SANDBOX_TOKEN || '' }}
      app_id: ${{ matrix.auth_mode == 'app' && secrets.ORG_AUTOMATION_APP_ID || '' }}
      app_private_key: ${{ matrix.auth_mode == 'app' && secrets.ORG_AUTOMATION_APP_PRIVATE_KEY || '' }}
