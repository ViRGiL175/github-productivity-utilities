# Integration test: creates real issues, runs AI Scrum review workflow, verifies review labels/comments, then cleans up.
name: Test ai-scrum-review-issue

on:
  workflow_dispatch:
    inputs:
      auth_mode:
        description: Token source to use for integration tests (pat=user sandbox, app=org sandbox)
        required: false
        default: pat
        type: choice
        options:
          - pat
          - app
      model:
        description: Optional Copilot model override for the integration run
        required: false
        default: gpt-4.1
        type: string
  pull_request:
    paths:
      - '.github/workflows/ai-scrum-review-issue.yml'
      - '.github/workflows/test-ai-scrum-review-issue.yml'
      - '.github/workflows/copilot-generate-text.yml'
      - '.secrets.example'
      - 'README.md'
      - 'scripts/run-act-test.js'

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  pull-requests: read

env:
  AUTH_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.auth_mode || 'pat' }}
  INSTALLATION_OWNER: ${{ github.event_name == 'workflow_dispatch' && inputs.auth_mode == 'app' && 'ViRGiL-GH-Productivity' || 'ViRGiL175' }}
  REPO_OWNER: ${{ github.event_name == 'workflow_dispatch' && inputs.auth_mode == 'app' && 'ViRGiL-GH-Productivity' || 'ViRGiL175' }}
  REPO_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.auth_mode == 'app' && 'scrum-test-backlog' || 'github-productivity-utilities' }}

jobs:
  prepare-scrum-review-scenario:
    name: Prepare Scrum review scenario
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    outputs:
      ready_issue_number: ${{ steps.prepare.outputs.ready_issue_number }}
      ready_issue_url: ${{ steps.prepare.outputs.ready_issue_url }}
      reject_issue_number: ${{ steps.prepare.outputs.reject_issue_number }}
      reject_issue_url: ${{ steps.prepare.outputs.reject_issue_url }}
    steps:
      - name: Normalize GitHub App private key
        if: ${{ env.AUTH_MODE == 'app' }}
        id: normalize-key
        shell: bash
        env:
          RAW_PRIVATE_KEY: ${{ secrets.ORG_AUTOMATION_APP_PRIVATE_KEY }}
        run: |
          if [[ "$RAW_PRIVATE_KEY" == *'\n'* ]]; then
            printf 'private_key<<EOF\n%b\nEOF\n' "$RAW_PRIVATE_KEY" >> "$GITHUB_OUTPUT"
          else
            printf 'private_key<<EOF\n%s\nEOF\n' "$RAW_PRIVATE_KEY" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub App installation token
        if: ${{ env.AUTH_MODE == 'app' }}
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.ORG_AUTOMATION_APP_ID }}
          private-key: ${{ steps.normalize-key.outputs.private_key }}
          owner: ${{ env.INSTALLATION_OWNER }}
          skip-token-revoke: true

      - name: Create test issues
        id: prepare
        uses: actions/github-script@v9
        env:
          REPO_OWNER: ${{ env.REPO_OWNER }}
          REPO_NAME: ${{ env.REPO_NAME }}
          READY_TITLE: ITEST-${{ github.run_id }} ai scrum ready
          REJECT_TITLE: ITEST-${{ github.run_id }} ai scrum rejected
        with:
          github-token: ${{ env.AUTH_MODE == 'app' && steps.app-token.outputs.token || secrets.ORG_PROJECT_TOKEN }}
          script: |
            const headers = { accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' };
            const owner = process.env.REPO_OWNER;
            const repo = process.env.REPO_NAME;
            const ready = await github.request('POST /repos/{owner}/{repo}/issues', {
              owner,
              repo,
              title: process.env.READY_TITLE,
              body: [
                `ITEST run ${context.runId} for ai-scrum-review ready scenario.`,
                '',
                '## User story',
                'As a maintainer, I want AI Scrum review to accept clear backlog stories, so that ready work can wait for planning without manual cleanup.',
                '',
                '## Acceptance criteria',
                '- The issue states who benefits and why the change matters.',
                '- The expected result is clear enough to verify later.',
                '- The story can safely wait in the backlog until implementation starts.',
              ].join('\n'),
              headers,
            });
            const rejected = await github.request('POST /repos/{owner}/{repo}/issues', {
              owner,
              repo,
              title: process.env.REJECT_TITLE,
              body: [
                `ITEST run ${context.runId} for ai-scrum-review rejected scenario.`,
                '',
                'Something should be improved eventually.',
                'No user goal, expected outcome, acceptance criteria, or Scrum-ready scope is provided.',
              ].join('\n'),
              headers,
            });
            core.setOutput('ready_issue_number', String(ready.data.number));
            core.setOutput('ready_issue_url', ready.data.html_url);
            core.setOutput('reject_issue_number', String(rejected.data.number));
            core.setOutput('reject_issue_url', rejected.data.html_url);

  run-scrum-ready-scenario:
    name: Run Scrum ready scenario
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    needs:
      - prepare-scrum-review-scenario
    uses: ./.github/workflows/ai-scrum-review-issue.yml
    with:
      issue_url: ${{ needs.prepare-scrum-review-scenario.outputs.ready_issue_url }}
      model: ${{ github.event_name == 'workflow_dispatch' && inputs.model || 'gpt-4.1' }}
      auth_mode: ${{ github.event_name == 'workflow_dispatch' && inputs.auth_mode || 'pat' }}
      installation_owner: ${{ github.event_name == 'workflow_dispatch' && inputs.auth_mode == 'app' && 'ViRGiL-GH-Productivity' || 'ViRGiL175' }}
    secrets:
      pat_token: ${{ secrets.ORG_PROJECT_TOKEN }}
      app_id: ${{ secrets.ORG_AUTOMATION_APP_ID }}
      app_private_key: ${{ secrets.ORG_AUTOMATION_APP_PRIVATE_KEY }}
      copilot_token: ${{ secrets.USER_COPILOT_FGPAT }}

  assert-scrum-ready-scenario:
    name: Assert Scrum ready scenario
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    needs:
      - prepare-scrum-review-scenario
      - run-scrum-ready-scenario
    runs-on: ubuntu-latest
    steps:
      - name: Normalize GitHub App private key
        if: ${{ env.AUTH_MODE == 'app' }}
        id: normalize-key
        shell: bash
        env:
          RAW_PRIVATE_KEY: ${{ secrets.ORG_AUTOMATION_APP_PRIVATE_KEY }}
        run: |
          if [[ "$RAW_PRIVATE_KEY" == *'\n'* ]]; then
            printf 'private_key<<EOF\n%b\nEOF\n' "$RAW_PRIVATE_KEY" >> "$GITHUB_OUTPUT"
          else
            printf 'private_key<<EOF\n%s\nEOF\n' "$RAW_PRIVATE_KEY" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub App installation token
        if: ${{ env.AUTH_MODE == 'app' }}
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.ORG_AUTOMATION_APP_ID }}
          private-key: ${{ steps.normalize-key.outputs.private_key }}
          owner: ${{ env.INSTALLATION_OWNER }}
          skip-token-revoke: true

      - name: Assert ready labels were set
        uses: actions/github-script@v9
        env:
          ISSUE_NUMBER: ${{ needs.prepare-scrum-review-scenario.outputs.ready_issue_number }}
          REPO_OWNER: ${{ env.REPO_OWNER }}
          REPO_NAME: ${{ env.REPO_NAME }}
        with:
          github-token: ${{ env.AUTH_MODE == 'app' && steps.app-token.outputs.token || secrets.ORG_PROJECT_TOKEN }}
          script: |
            const headers = { accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' };
            const owner = process.env.REPO_OWNER;
            const repo = process.env.REPO_NAME;
            const issueNumber = Number(process.env.ISSUE_NUMBER);
            const issue = await github.request('GET /repos/{owner}/{repo}/issues/{issue_number}', { owner, repo, issue_number: issueNumber, headers });
            const labels = (issue.data.labels ?? []).map((label) => label.name);
            if (!labels.includes('ai-scrum-processed')) throw new Error(`Expected ai-scrum-processed label, got: ${labels.join(', ') || 'none'}.`);
            if (labels.includes('ai-scrum-rejected')) throw new Error('Did not expect ai-scrum-rejected label on ready scenario.');

  run-scrum-rejected-scenario:
    name: Run Scrum rejected scenario
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    needs:
      - prepare-scrum-review-scenario
      - assert-scrum-ready-scenario
    uses: ./.github/workflows/ai-scrum-review-issue.yml
    with:
      issue_url: ${{ needs.prepare-scrum-review-scenario.outputs.reject_issue_url }}
      model: ${{ github.event_name == 'workflow_dispatch' && inputs.model || 'gpt-4.1' }}
      auth_mode: ${{ github.event_name == 'workflow_dispatch' && inputs.auth_mode || 'pat' }}
      installation_owner: ${{ github.event_name == 'workflow_dispatch' && inputs.auth_mode == 'app' && 'ViRGiL-GH-Productivity' || 'ViRGiL175' }}
    secrets:
      pat_token: ${{ secrets.ORG_PROJECT_TOKEN }}
      app_id: ${{ secrets.ORG_AUTOMATION_APP_ID }}
      app_private_key: ${{ secrets.ORG_AUTOMATION_APP_PRIVATE_KEY }}
      copilot_token: ${{ secrets.USER_COPILOT_FGPAT }}

  assert-scrum-rejected-scenario:
    name: Assert Scrum rejected scenario
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    needs:
      - prepare-scrum-review-scenario
      - run-scrum-rejected-scenario
    runs-on: ubuntu-latest
    steps:
      - name: Normalize GitHub App private key
        if: ${{ env.AUTH_MODE == 'app' }}
        id: normalize-key
        shell: bash
        env:
          RAW_PRIVATE_KEY: ${{ secrets.ORG_AUTOMATION_APP_PRIVATE_KEY }}
        run: |
          if [[ "$RAW_PRIVATE_KEY" == *'\n'* ]]; then
            printf 'private_key<<EOF\n%b\nEOF\n' "$RAW_PRIVATE_KEY" >> "$GITHUB_OUTPUT"
          else
            printf 'private_key<<EOF\n%s\nEOF\n' "$RAW_PRIVATE_KEY" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub App installation token
        if: ${{ env.AUTH_MODE == 'app' }}
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.ORG_AUTOMATION_APP_ID }}
          private-key: ${{ steps.normalize-key.outputs.private_key }}
          owner: ${{ env.INSTALLATION_OWNER }}
          skip-token-revoke: true

      - name: Assert rejected labels and comment were set
        uses: actions/github-script@v9
        env:
          ISSUE_NUMBER: ${{ needs.prepare-scrum-review-scenario.outputs.reject_issue_number }}
          REPO_OWNER: ${{ env.REPO_OWNER }}
          REPO_NAME: ${{ env.REPO_NAME }}
        with:
          github-token: ${{ env.AUTH_MODE == 'app' && steps.app-token.outputs.token || secrets.ORG_PROJECT_TOKEN }}
          script: |
            const headers = { accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' };
            const owner = process.env.REPO_OWNER;
            const repo = process.env.REPO_NAME;
            const issueNumber = Number(process.env.ISSUE_NUMBER);
            const issue = await github.request('GET /repos/{owner}/{repo}/issues/{issue_number}', { owner, repo, issue_number: issueNumber, headers });
            const labels = (issue.data.labels ?? []).map((label) => label.name);
            if (!labels.includes('ai-scrum-rejected')) throw new Error(`Expected ai-scrum-rejected label, got: ${labels.join(', ') || 'none'}.`);
            if (!labels.includes('ai-scrum-processed')) throw new Error(`Expected ai-scrum-processed label, got: ${labels.join(', ') || 'none'}.`);
            const comments = await github.paginate('GET /repos/{owner}/{repo}/issues/{issue_number}/comments', { owner, repo, issue_number: issueNumber, per_page: 100, headers });
            const aiComment = comments.find((comment) => (comment.body ?? '').includes('## AI Scrum review'));
            if (!aiComment) throw new Error('Expected an AI Scrum review comment on rejected scenario.');

  cleanup-scrum-review-scenario:
    name: Cleanup Scrum review scenario
    if: ${{ always() && needs.prepare-scrum-review-scenario.outputs.ready_issue_number != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    needs:
      - prepare-scrum-review-scenario
      - run-scrum-ready-scenario
      - assert-scrum-ready-scenario
      - run-scrum-rejected-scenario
      - assert-scrum-rejected-scenario
    runs-on: ubuntu-latest
    steps:
      - name: Normalize GitHub App private key
        if: ${{ env.AUTH_MODE == 'app' }}
        id: normalize-key
        shell: bash
        env:
          RAW_PRIVATE_KEY: ${{ secrets.ORG_AUTOMATION_APP_PRIVATE_KEY }}
        run: |
          if [[ "$RAW_PRIVATE_KEY" == *'\n'* ]]; then
            printf 'private_key<<EOF\n%b\nEOF\n' "$RAW_PRIVATE_KEY" >> "$GITHUB_OUTPUT"
          else
            printf 'private_key<<EOF\n%s\nEOF\n' "$RAW_PRIVATE_KEY" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub App installation token
        if: ${{ env.AUTH_MODE == 'app' }}
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.ORG_AUTOMATION_APP_ID }}
          private-key: ${{ steps.normalize-key.outputs.private_key }}
          owner: ${{ env.INSTALLATION_OWNER }}
          skip-token-revoke: true

      - name: Close issues
        uses: actions/github-script@v9
        env:
          READY_ISSUE_NUMBER: ${{ needs.prepare-scrum-review-scenario.outputs.ready_issue_number }}
          REJECT_ISSUE_NUMBER: ${{ needs.prepare-scrum-review-scenario.outputs.reject_issue_number }}
          REPO_OWNER: ${{ env.REPO_OWNER }}
          REPO_NAME: ${{ env.REPO_NAME }}
        with:
          github-token: ${{ env.AUTH_MODE == 'app' && steps.app-token.outputs.token || secrets.ORG_PROJECT_TOKEN }}
          script: |
            const headers = { accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' };
            const owner = process.env.REPO_OWNER;
            const repo = process.env.REPO_NAME;
            for (const number of [Number(process.env.READY_ISSUE_NUMBER), Number(process.env.REJECT_ISSUE_NUMBER)]) {
              if (number > 0) await github.request('PATCH /repos/{owner}/{repo}/issues/{issue_number}', { owner, repo, issue_number: number, state: 'closed', headers });
            }

  test-skipped-for-fork-pr:
    name: Test skipped for fork PR
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
    runs-on: ubuntu-latest
    steps:
      - name: Explain why test is skipped
        run: echo "Skipping integration test for fork pull requests because repository secrets are unavailable."
