# Manual test: real native issue field and real sub-issues in the isolated organization.
# The App needs Issue Fields (write) for this test; a classic PAT needs admin:org.
name: Test native Inbox transition

on:
  pull_request:
    paths:
      - '.github/workflows/detach-inbox-sub-issues.yml'
      - '.github/workflows/test-detach-inbox-sub-issues.yml'
      - 'src/**'
      - 'test/**'
  workflow_dispatch:
    inputs:
      auth_mode:
        type: choice
        options: [app, pat]
        default: app

permissions:
  contents: read

jobs:
  integration:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    concurrency:
      group: test-native-inbox-transition
      cancel-in-progress: false
    env:
      AUTH_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.auth_mode || 'app' }}
      ORG: ViRGiL-GH-Productivity
      REPO: scrum-test-backlog
      APP_PRIVATE_KEY: ${{ secrets.ORG_AUTOMATION_APP_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v6
      - name: Normalize GitHub App private key
        if: ${{ env.AUTH_MODE == 'app' }}
        id: normalize-key
        shell: bash
        run: |
          if [[ "$APP_PRIVATE_KEY" == *'\n'* ]]; then
            printf 'private_key<<EOF\n%b\nEOF\n' "$APP_PRIVATE_KEY" >> "$GITHUB_OUTPUT"
          else
            printf 'private_key<<EOF\n%s\nEOF\n' "$APP_PRIVATE_KEY" >> "$GITHUB_OUTPUT"
          fi
      - name: Create GitHub App token
        if: ${{ env.AUTH_MODE == 'app' }}
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.ORG_AUTOMATION_APP_ID }}
          private-key: ${{ steps.normalize-key.outputs.private_key }}
          owner: ${{ env.ORG }}
          skip-token-revoke: true
      - name: Exercise native Inbox transitions
        uses: actions/github-script@v8
        with:
          github-token: ${{ env.AUTH_MODE == 'app' && steps.app-token.outputs.token || secrets.ORG_PROJECT_TOKEN }}
          script: |
            const owner = process.env.ORG, repo = process.env.REPO;
            const fieldName = `ITEST Horizon ${context.runId}`;
            const nativeHeaders = { accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2026-03-10' };
            const issueHeaders = { accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' };
            let field, parent, child, inboxParent, inboxChild;
            const setHorizon = (issue, value) => github.request('POST /repos/{owner}/{repo}/issues/{issue_number}/issue-field-values', {
              owner, repo, issue_number: issue.number, issue_field_values: [{ field_id: field.id, value }], headers: nativeHeaders,
            });
            const parentOf = async (issue) => {
              try { return (await github.request('GET /repos/{owner}/{repo}/issues/{issue_number}/parent', { owner, repo, issue_number: issue.number, headers: issueHeaders })).data; }
              catch (error) { if (error.status === 404) return null; throw error; }
            };
            const { run } = await import(`${process.env.GITHUB_WORKSPACE}/src/scripts/detach-inbox-sub-issues.ts`);
            const runFor = async (issue, previous, dryRun = false) => {
              Object.assign(process.env, {
                HORIZON_FIELD_NAME: fieldName, INBOX_VALUE: '📥 Inbox', ISSUE_NODE_ID: issue.node_id,
                ISSUE_REPO_OWNER: owner, ISSUE_REPO_NAME: repo, ISSUE_NUMBER: String(issue.number),
                PREVIOUS_HORIZON: previous, CURRENT_HORIZON: '📥 Inbox', DRY_RUN: String(dryRun),
              });
              await run(github);
            };
            try {
              field = (await github.request('POST /orgs/{org}/issue-fields', {
                org: owner, name: fieldName, data_type: 'single_select',
                options: [{ name: 'Ideas', color: 'blue', priority: 0 }, { name: '📥 Inbox', color: 'gray', priority: 1 }],
                headers: nativeHeaders,
              })).data;
              parent = (await github.request('POST /repos/{owner}/{repo}/issues', { owner, repo, title: `${fieldName} parent`, headers: issueHeaders })).data;
              child = (await github.request('POST /repos/{owner}/{repo}/issues', { owner, repo, title: `${fieldName} child`, body: 'Manual text', headers: issueHeaders })).data;
              await github.request('POST /repos/{owner}/{repo}/issues/{issue_number}/sub_issues', { owner, repo, issue_number: parent.number, sub_issue_id: child.id, headers: issueHeaders });
              await setHorizon(parent, 'Ideas');
              await setHorizon(child, 'Ideas');
              await setHorizon(child, '📥 Inbox');
              await runFor(child, 'Ideas', true);
              if ((await parentOf(child))?.id !== parent.id) throw new Error('Dry-run changed the parent.');
              await runFor(child, 'Ideas');
              if (await parentOf(child)) throw new Error('Child was not detached.');
              const body = (await github.request('GET /repos/{owner}/{repo}/issues/{issue_number}', { owner, repo, issue_number: child.number, headers: issueHeaders })).data.body;
              if (!body.includes('Manual text') || !body.includes(parent.html_url)) throw new Error('Former-parent block is missing.');
              inboxParent = (await github.request('POST /repos/{owner}/{repo}/issues', { owner, repo, title: `${fieldName} Inbox parent`, headers: issueHeaders })).data;
              inboxChild = (await github.request('POST /repos/{owner}/{repo}/issues', { owner, repo, title: `${fieldName} Inbox child`, headers: issueHeaders })).data;
              await github.request('POST /repos/{owner}/{repo}/issues/{issue_number}/sub_issues', { owner, repo, issue_number: inboxParent.number, sub_issue_id: inboxChild.id, headers: issueHeaders });
              await setHorizon(inboxParent, '📥 Inbox');
              await setHorizon(inboxChild, 'Ideas');
              await setHorizon(inboxChild, '📥 Inbox');
              await runFor(inboxChild, 'Ideas');
              if ((await parentOf(inboxChild))?.id !== inboxParent.id) throw new Error('Inbox subtree was broken.');
              await runFor(inboxChild, '');
              if ((await parentOf(inboxChild))?.id !== inboxParent.id) throw new Error('Initial Inbox placement changed the parent.');
            } finally {
              for (const [p, c] of [[parent, child], [inboxParent, inboxChild]]) {
                if (p && c) {
                  try { await github.request('DELETE /repos/{owner}/{repo}/issues/{issue_number}/sub_issue', { owner, repo, issue_number: p.number, sub_issue_id: c.id, headers: issueHeaders }); }
                  catch (error) { if (error.status !== 404) core.warning(error.message); }
                }
              }
              for (const issue of [child, parent, inboxChild, inboxParent].filter(Boolean)) {
                await github.request('PATCH /repos/{owner}/{repo}/issues/{issue_number}', { owner, repo, issue_number: issue.number, state: 'closed', headers: issueHeaders });
              }
              if (field) await github.request('DELETE /orgs/{org}/issue-fields/{issue_field_id}', { org: owner, issue_field_id: field.id, headers: nativeHeaders });
            }
