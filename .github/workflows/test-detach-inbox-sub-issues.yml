# Real Project V2 and sub-issue integration test. Fixtures live only in the test sandbox.
name: Test detach-inbox-sub-issues

on:
  pull_request:
    paths:
      - '.github/workflows/detach-inbox-sub-issues.yml'
      - '.github/workflows/test-detach-inbox-sub-issues.yml'
      - 'src/**'
      - 'test/**'
  workflow_dispatch:
    inputs:
      auth_mode:
        type: choice
        options: [pat, app]
        default: pat

permissions:
  contents: read

jobs:
  integration:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    concurrency:
      group: test-detach-inbox-sub-issues
      cancel-in-progress: false
    env:
      AUTH_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.auth_mode || 'pat' }}
      PROJECT_OWNER: ${{ github.event_name == 'workflow_dispatch' && inputs.auth_mode == 'app' && 'ViRGiL-GH-Productivity' || 'ViRGiL175' }}
      PROJECT_NUMBER: ${{ github.event_name == 'workflow_dispatch' && inputs.auth_mode == 'app' && '1' || '10' }}
      REPO_OWNER: ${{ github.event_name == 'workflow_dispatch' && inputs.auth_mode == 'app' && 'ViRGiL-GH-Productivity' || 'ViRGiL175' }}
      REPO_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.auth_mode == 'app' && 'scrum-test-backlog' || 'github-productivity-utilities' }}
      PAT_TOKEN: ${{ secrets.ORG_PROJECT_TOKEN }}
      APP_ID: ${{ secrets.ORG_AUTOMATION_APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.ORG_AUTOMATION_APP_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v6
      - name: Normalize GitHub App private key
        if: ${{ env.AUTH_MODE == 'app' }}
        id: normalize-key
        shell: bash
        run: |
          if [[ "$APP_PRIVATE_KEY" == *'\n'* ]]; then
            printf 'private_key<<EOF\n%b\nEOF\n' "$APP_PRIVATE_KEY" >> "$GITHUB_OUTPUT"
          else
            printf 'private_key<<EOF\n%s\nEOF\n' "$APP_PRIVATE_KEY" >> "$GITHUB_OUTPUT"
          fi
      - name: Create GitHub App token
        if: ${{ env.AUTH_MODE == 'app' }}
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.ORG_AUTOMATION_APP_ID }}
          private-key: ${{ steps.normalize-key.outputs.private_key }}
          owner: ${{ env.PROJECT_OWNER }}
          skip-token-revoke: true
      - name: Resolve token
        id: auth
        shell: bash
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          if [ "$AUTH_MODE" = app ]; then TOKEN="$APP_TOKEN"; else TOKEN="$PAT_TOKEN"; fi
          if [ -z "$TOKEN" ]; then echo "Integration token is empty" >&2; exit 1; fi
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"
      - name: Create fixture, run dry-run and live reconciliation, assert and clean up
        uses: actions/github-script@v8
        with:
          github-token: ${{ steps.auth.outputs.token }}
          script: |
            const owner = process.env.REPO_OWNER;
            const repo = process.env.REPO_NAME;
            const projectOwner = process.env.PROJECT_OWNER;
            const projectNumber = Number(process.env.PROJECT_NUMBER);
            const fieldName = `ITEST Inbox ${context.runId}`;
            const headers = { accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' };
            let fieldId, childItemId, parent, child, projectId;
            try {
              const type = (await github.request('GET /users/{username}', { username: projectOwner, headers })).data.type;
              const root = type === 'Organization' ? 'organization' : 'user';
              const data = await github.graphql(`query($owner: String!, $number: Int!) { ${root}(login: $owner) { projectV2(number: $number) { id } } }`, { owner: projectOwner, number: projectNumber });
              projectId = data[root]?.projectV2?.id;
              if (!projectId) throw new Error('Sandbox project was not found.');
              const field = await github.graphql(`mutation($input: CreateProjectV2FieldInput!) {
                createProjectV2Field(input: $input) { projectV2Field {
                  ... on ProjectV2SingleSelectField { id options { id name } }
                } }
              }`, { input: { projectId, name: fieldName, dataType: 'SINGLE_SELECT', singleSelectOptions: [{ name: '📥 Inbox', color: 'GRAY', description: '' }] } });
              fieldId = field.createProjectV2Field.projectV2Field.id;
              const optionId = field.createProjectV2Field.projectV2Field.options[0].id;
              parent = (await github.request('POST /repos/{owner}/{repo}/issues', { owner, repo, title: `ITEST ${context.runId} Inbox parent`, headers })).data;
              child = (await github.request('POST /repos/{owner}/{repo}/issues', { owner, repo, title: `ITEST ${context.runId} Inbox child`, body: 'Manual text', headers })).data;
              childItemId = (await github.graphql(`mutation($projectId: ID!, $contentId: ID!) {
                addProjectV2ItemById(input: { projectId: $projectId, contentId: $contentId }) { item { id } }
              }`, { projectId, contentId: child.node_id })).addProjectV2ItemById.item.id;
              await github.graphql(`mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
                updateProjectV2ItemFieldValue(input: { projectId: $projectId, itemId: $itemId, fieldId: $fieldId, value: { singleSelectOptionId: $optionId } }) { projectV2Item { id } }
              }`, { projectId, itemId: childItemId, fieldId, optionId });
              await github.request('POST /repos/{owner}/{repo}/issues/{issue_number}/sub_issues', { owner, repo, issue_number: parent.number, sub_issue_id: child.id, headers });

              process.env.PROJECT_OWNER = projectOwner;
              process.env.PROJECT_NUMBER = String(projectNumber);
              process.env.HORIZON_FIELD_NAME = fieldName;
              process.env.INBOX_VALUE = '📥 Inbox';
              const { ProjectV2Repository } = await import(`${process.env.GITHUB_WORKSPACE}/src/github/ProjectV2Repository.ts`);
              const projects = new ProjectV2Repository(github);
              let fixtureVisible = false;
              for (let attempt = 0; attempt < 12; attempt += 1) {
                const items = await projects.listOpenIssuesWithField(projectId, fieldName);
                fixtureVisible = items.some((item) => item.nodeId === child.node_id && item.parentNodeId === parent.node_id && item.fieldValue === '📥 Inbox');
                if (fixtureVisible) break;
                await new Promise((resolve) => setTimeout(resolve, 3000));
              }
              if (!fixtureVisible) throw new Error('Inbox fixture did not become visible in the project scan.');
              const { run } = await import(`${process.env.GITHUB_WORKSPACE}/src/scripts/detach-inbox-sub-issues.ts`);
              process.env.DRY_RUN = 'true';
              await run(github);
              const dryParent = await github.request('GET /repos/{owner}/{repo}/issues/{issue_number}/parent', { owner, repo, issue_number: child.number, headers });
              if (dryParent.data.id !== parent.id) throw new Error('Dry-run changed the parent.');
              process.env.DRY_RUN = 'false';
              await run(github);
              await run(github);
              const updated = (await github.request('GET /repos/{owner}/{repo}/issues/{issue_number}', { owner, repo, issue_number: child.number, headers })).data;
              if (!updated.body?.includes('Manual text') || !updated.body?.includes(parent.html_url)) throw new Error('Former-parent block or manual text is missing.');
              if ((updated.body.match(/former-parent:start/g) ?? []).length !== 1) throw new Error('Managed block was duplicated.');
              try {
                await github.request('GET /repos/{owner}/{repo}/issues/{issue_number}/parent', { owner, repo, issue_number: child.number, headers });
                throw new Error('Inbox child still has a parent.');
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            } finally {
              if (parent && child) {
                try { await github.request('DELETE /repos/{owner}/{repo}/issues/{issue_number}/sub_issue', { owner, repo, issue_number: parent.number, sub_issue_id: child.id, headers }); } catch (error) { if (error.status !== 404) core.warning(error.message); }
              }
              if (childItemId && projectId) await github.graphql(`mutation($input: DeleteProjectV2ItemInput!) { deleteProjectV2Item(input: $input) { deletedItemId } }`, { input: { projectId, itemId: childItemId } });
              if (fieldId) await github.graphql(`mutation($input: DeleteProjectV2FieldInput!) { deleteProjectV2Field(input: $input) { projectV2Field { __typename } } }`, { input: { fieldId } });
              for (const issue of [child, parent].filter(Boolean)) await github.request('PATCH /repos/{owner}/{repo}/issues/{issue_number}', { owner, repo, issue_number: issue.number, state: 'closed', headers });
            }
