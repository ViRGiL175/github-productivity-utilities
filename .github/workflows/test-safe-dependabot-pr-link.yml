# Integration test: создаёт открытый и закрытый PR в sandbox-репозитории,
# запускает safe reconciler и проверяет стартовый/финальный статус и идемпотентность.
name: Test safe-dependabot-pr-link

on:
  workflow_dispatch:
    inputs:
      auth_mode:
        description: Token source to use for integration tests (pat=CI_SANDBOX_TOKEN, app=GitHub App; both use org sandbox)
        required: false
        default: pat
        type: choice
        options:
          - pat
          - app
  pull_request:
    paths:
      - 'package*.json'
      - '.github/workflows/safe-dependabot-pr-link.yml'
      - '.github/workflows/test-safe-dependabot-pr-link.yml'
      - '.github/workflows/sandbox-auth-modes.yml'
      - '.github/workflows/itest-safe-dependabot-pr-link.yml'
      - 'src/automations/safe-dependabot-pr-link/**'
      - 'src/automations/field-updates/**'
      - 'src/github/FieldController.ts'
      - 'src/github/IssueRepository.ts'
      - 'src/scripts/safe-dependabot-pr-link.ts'
      - 'src/scripts/environment.ts'
      - 'src/runtime/**'
      - 'src/github/ProjectV2Repository.ts'
      - 'src/github/PullRequestRepository.ts'

concurrency:
  group: integration-org-sandbox
  queue: max
  cancel-in-progress: false

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  auth-modes:
    uses: ./.github/workflows/sandbox-auth-modes.yml
    with:
      requested_mode: ${{ inputs.auth_mode || '' }}

  sandbox:
    name: Sandbox (${{ matrix.auth_mode }})
    needs: auth-modes
    if: needs.auth-modes.outputs.modes != ''
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        auth_mode: ${{ fromJSON(needs.auth-modes.outputs.modes) }}
    uses: ./.github/workflows/itest-safe-dependabot-pr-link.yml
    with:
      auth_mode: ${{ matrix.auth_mode }}
    secrets:
      pat_token: ${{ matrix.auth_mode == 'pat' && secrets.CI_SANDBOX_TOKEN || '' }}
      app_id: ${{ matrix.auth_mode == 'app' && secrets.ORG_AUTOMATION_APP_ID || '' }}
      app_private_key: ${{ matrix.auth_mode == 'app' && secrets.ORG_AUTOMATION_APP_PRIVATE_KEY || '' }}
